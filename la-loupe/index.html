<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>La Loupe — rêve</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--line:rgba(255,220,160,.14);--muted:rgba(255,236,210,.55);--cash:#9be37d;--dirty:#e8c96a;--heat:#ff8a6a;--accent:#ffb454;--snap:#ff2d55;--beuher:#00c46a;--shelter:#6ec8ff}
html,body{width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#f4ebe0;background:#07060a}
#phone{position:fixed;inset:0;max-width:440px;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(120% 80% at 50% -10%,#3a1830 0%,#141018 45%,#07060a 100%);
  border-left:1px solid var(--line);border-right:1px solid var(--line)}
#top{padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:grid;gap:6px;background:rgba(0,0,0,.55);
  border-bottom:1px solid var(--line);z-index:30;backdrop-filter:blur(12px)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);white-space:nowrap}
.pill.cash{color:var(--cash)}.pill.dirty{color:var(--dirty)}.pill.heat{color:var(--heat)}.pill.rep{color:#9ec9ff}.pill.expo{color:#ff8ab8}
/* ARAH — l'évacuation. Plein écran, au-dessus de tout : quand ils arrivent, il n'y a
   plus qu'une chose à faire, et le jeu doit le dire sans ambiguïté. */
#arah{position:fixed;inset:0;z-index:120;background:rgba(14,6,6,.94);display:flex;align-items:center;justify-content:center;padding:18px}
#arah.hide{display:none}
.arah-box{max-width:420px;width:100%;text-align:center}
.arah-t{font-size:26px;font-weight:900;color:#ff6a6a;letter-spacing:.04em;animation:arahPulse .7s ease-in-out infinite}
@keyframes arahPulse{0%,100%{opacity:1}50%{opacity:.5}}
.arah-s{color:#e8ecf4;font-size:13px;margin:6px 0 12px}
.arah-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:14px}
.arah-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd06a,#ff6a6a);transition:width .1s linear}
.arah-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arah-c{border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.07);color:#e8ecf4;
  font:inherit;font-weight:800;font-size:12px;padding:16px 8px;cursor:pointer}
.arah-c.cool{opacity:.35;pointer-events:none}
.arah-i{font-size:26px;margin-bottom:4px}
.arah-f{margin-top:14px;font-size:12px;color:#c9d2e0}
#toast{position:fixed;left:50%;top:20%;transform:translate(-50%,8px);opacity:0;transition:.2s;z-index:180;
  background:rgba(0,0,0,.82);border:1px solid var(--line);padding:11px 14px;border-radius:14px;font-weight:800;text-align:center;max-width:88%;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#main{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch;z-index:2}
#stage.behind{visibility:hidden;pointer-events:none}
#view3d{display:none;position:absolute;inset:0;z-index:3;touch-action:none;background:#14101b}
#view3d.on{display:block}
#hud3d{position:absolute;inset:0;z-index:4;pointer-events:none}
#hint3d{position:absolute;left:0;right:0;bottom:max(72px, env(safe-area-inset-bottom) + 58px);text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.55);text-shadow:0 2px 8px #000;padding:0 12px}
#load3d{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;display:none;
  flex-direction:column;align-items:center;gap:12px;pointer-events:auto;text-align:center;width:78%;max-width:280px}
#load3d.on{display:flex}
#load3d .ld{font-size:13px;font-weight:800;color:rgba(255,236,210,.85);animation:ldPulse 1.2s ease-in-out infinite}
@keyframes ldPulse{0%,100%{opacity:.5}50%{opacity:1}}
#presslbl,#wraptext{position:absolute;left:50%;transform:translateX(-50%);bottom:max(118px, env(safe-area-inset-bottom) + 104px);font-size:13px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000;display:none;white-space:nowrap}
#presslbl.show,#wraptext.show{display:block}
#pressbar,#wrapbar{position:absolute;left:50%;transform:translateX(-50%);width:66%;max-width:300px;height:18px;bottom:max(92px, env(safe-area-inset-bottom) + 78px);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;overflow:hidden;display:none}
#pressbar.show,#wrapbar.show{display:block}
#pressfill{height:100%;width:0;background:linear-gradient(90deg,#ff9f6b,#ff5e1a)}
#wrapfill{height:100%;width:0;background:linear-gradient(90deg,#7df9ff,#9be37d)}
#seal{position:absolute;left:50%;transform:translateX(-50%);bottom:max(88px, env(safe-area-inset-bottom) + 74px);display:none;pointer-events:auto;background:#ff7a3c;border:none;color:#fff;font-weight:800;font-size:16px;padding:12px 24px;border-radius:14px;z-index:5}
#seal.show{display:block}
#fmtBar{position:absolute;top:10px;left:10px;right:10px;z-index:5;pointer-events:auto;display:none;gap:6px;flex-wrap:wrap;justify-content:center}
#fmtBar.on{display:flex}
#buyOverlay{position:absolute;left:10px;right:10px;bottom:max(70px, env(safe-area-inset-bottom) + 56px);z-index:5;pointer-events:auto;display:none;max-height:42%;overflow:auto;background:rgba(20,16,14,.92);border:1px solid var(--line);border-radius:16px;padding:12px}
#buyOverlay.on{display:block}
#dock{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px max(10px,env(safe-area-inset-bottom));background:rgba(0,0,0,.6);border-top:1px solid var(--line);z-index:30}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:700;padding:8px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab .ic{font-size:20px;line-height:1}.tab.on{color:#fff;background:rgba(255,180,84,.16)}
h2{font-size:20px;font-weight:900;letter-spacing:.2px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px;line-height:1.35;margin-bottom:12px}
.card{background:rgba(38,30,22,.92);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.card h3{font-size:14px;font-weight:800;margin-bottom:6px}
.muted{color:var(--muted);font-size:12px;line-height:1.35}
.btn{appearance:none;border:1px solid rgba(255,180,84,.45);background:linear-gradient(180deg,#3a2a16,#24180e);color:#ffe4b5;font-weight:800;font-size:13px;padding:11px 12px;border-radius:12px;width:100%;margin-top:8px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.4}
.btn.ok{border-color:rgba(125,222,160,.45);background:linear-gradient(180deg,#1f3324,#132018);color:#c8f5d6}
.btn.ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:#f0e2cf}
.btn.bad{border-color:rgba(255,122,122,.45);background:linear-gradient(180deg,#3a1818,#241010);color:#ffd0d0}
.btn.snap{border-color:rgba(255,45,85,.55);background:linear-gradient(180deg,#4a1528,#2a0e18);color:#ffd0dc}
.btn.beuher{border-color:rgba(0,196,106,.5);background:linear-gradient(180deg,#0f3324,#0a2018);color:#c8f5d6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chip{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:800;color:var(--muted)}
.chip.on{color:#fff;border-color:rgba(255,180,84,.55);background:rgba(255,180,84,.16)}
.chip.cs{width:100%;text-align:center;pointer-events:none;background:rgba(0,0,0,.45);border-color:transparent;
  color:rgba(255,236,210,.85);font-weight:700;font-size:11px;padding:5px 8px}
.chip.cs b{color:#ffe4b5}
.stat{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.06);gap:8px}
.stat b{font-weight:800;text-align:right}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#7ddea0,#ffb454)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0 20px}
.app{appearance:none;border:0;background:transparent;color:#fff;text-align:center}
.app .icon{width:64px;height:64px;margin:0 auto;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 10px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18)}
.app .nm{font-size:11px;font-weight:800;margin-top:7px}
.app.snap .icon{background:linear-gradient(145deg,#ff4d6d,#c01040)}
.app.beuher .icon{background:linear-gradient(145deg,#22e07a,#0a8f4a)}
.app.atelier .icon{background:linear-gradient(145deg,#c06d6d,#6a3030)}
.app.appro .icon{background:linear-gradient(145deg,#6d8ac0,#334a7a)}
.app.cash .icon{background:linear-gradient(145deg,#e8c96a,#8a6a20)}
.app.karnet .icon{background:linear-gradient(145deg,#9a8ab0,#4a3a60)}
.app.shelter .icon{background:linear-gradient(145deg,#6ec8ff,#2a5a8a)}
/* ---- Shelter · carte Quartier Nord ---- */
.map-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  background:#1a1510;margin-bottom:10px;aspect-ratio:1;max-height:min(52vh,360px)}
.map-wrap img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(.9) contrast(1.05)}
.map-pin{position:absolute;transform:translate(-50%,-100%);border:0;background:transparent;padding:0;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.map-pin .dot{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.25)}
.map-pin .lbl{margin-top:3px;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;
  background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;white-space:nowrap;max-width:72px;
  overflow:hidden;text-overflow:ellipsis}
.map-pin.planque .dot{background:#6ec8ff}
.map-pin.pdv .dot{background:#9be37d}
.map-pin.rival .dot{background:#ff8a6a}
.map-pin.info .dot{background:#e8c96a}
.map-pin.on .dot{box-shadow:0 0 0 3px rgba(255,180,84,.55),0 0 12px rgba(255,180,84,.35)}
.map-pin.locked{opacity:.55}
.map-pin.locked .dot{filter:grayscale(.4)}
.map-pin .pin-bac{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
  font-size:9px;font-weight:800;color:#0b120c;background:#9be37d;padding:1px 5px;border-radius:8px;
  white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.55);z-index:3;pointer-events:none}
.map-pin .pin-bac.off{display:none}
.debt-strip{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;margin-bottom:10px;
  background:rgba(200,68,47,.14);border:1px solid rgba(255,138,106,.4);font-size:11px;font-weight:700}
.debt-strip b{color:#ffb0a0}
.debt-strip .go{margin-left:auto;appearance:none;border:1px solid rgba(155,227,125,.45);background:rgba(30,60,40,.6);
  color:#c8f5d6;font-weight:800;font-size:11px;padding:6px 10px;border-radius:9px;white-space:nowrap}
.hit-chip{font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.hit-chip.ok{background:rgba(0,196,106,.18);color:#9be37d}
.hit-chip.mid{background:rgba(232,201,106,.18);color:#e8c96a}
.hit-chip.hot{background:rgba(255,80,80,.22);color:#ff8a6a}
/* Le Corner — négo présentielle (étape 2) */
.nego-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.nego-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.nego-nm{font-weight:800;font-size:14px}
.nego-tag{font-size:9px;font-weight:800;letter-spacing:.4px;border-radius:4px;padding:1px 5px;margin-left:5px;background:rgba(255,255,255,.08)}
.nego-rel{margin-left:auto;font-size:10px;color:var(--muted,#9aa)}.nego-rel b{color:#e8ecf4}
.nego-tx{background:rgba(255,255,255,.05);border-radius:4px 12px 12px 12px;padding:8px 10px;margin:4px 0 6px;font-size:13px}
.offer{font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap;font-size:12px}
.offer.q-fair{background:rgba(255,214,107,.16);color:#ffd66b}
.offer.q-good{background:rgba(113,230,164,.16);color:#71e6a4}
.offer.q-low{background:rgba(255,184,76,.16);color:#ffb84c}
.offer.q-scam{background:rgba(255,93,108,.16);color:#ff9aa5}
.nego-pat{height:4px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:4px 0 8px}
.nego-pat i{display:block;height:100%;width:100%;background:#3ddc84}
.nego-price{display:flex;align-items:center;gap:6px;margin:6px 0}
.nego-price .pb{border:0;border-radius:8px;background:rgba(255,255,255,.08);color:#e8ecf4;font:inherit;font-weight:800;padding:8px 0;width:42px;cursor:pointer}
.nego-price #negoP{flex:1;text-align:center;font-size:16px;font-weight:800}
.nego-face{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 10px;margin:2px 0 8px}
.nego-face .nfEmo{font-size:22px}
.nego-face .nfTx{color:#9aa4b8;font-weight:600;font-size:12px}
/* Le Corner — mise en scène rue (étape 2b, Option B : scène plein écran) */
#stage.corner-mode{padding:0;overflow:hidden}
.cscene{position:absolute;inset:0;width:100%;height:100%;background:linear-gradient(180deg,#070a16 0%,#0d1226 40%,#131a30 58%,#131a30 100%);overflow:hidden}
.cbat{position:absolute;bottom:28%;background:#0d1120;box-shadow:0 -2px 30px #0009}
.cbat .cgrid{position:absolute;inset:10px 8px;opacity:.5;background-image:repeating-linear-gradient(0deg,#1a2138 0 7px,transparent 7px 16px),repeating-linear-gradient(90deg,#1a2138 0 9px,transparent 9px 20px)}
.cwin{position:absolute;width:9px;height:7px;background:#ffd977;border-radius:1px;box-shadow:0 0 8px #ffd97788}
.clamp{position:absolute;left:34%;bottom:28%;width:4px;height:30%;background:linear-gradient(180deg,#39415a,#20263a)}
.clamp::before{content:"";position:absolute;top:-6px;left:-7px;width:18px;height:8px;border-radius:4px;background:#3c445e}
.clamp::after{content:"";position:absolute;top:-2px;left:-4px;width:12px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 18px 6px #ffe9a866;opacity:var(--night,1)}
.ccone{position:absolute;left:34%;bottom:0;width:220px;height:28%;transform:translateX(-48%);background:linear-gradient(180deg,#ffe9a81f 0%,#ffe9a805 70%,transparent 100%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(3px);pointer-events:none;opacity:var(--night,1)}
.cground{position:absolute;bottom:0;left:0;right:0;height:28%;background:linear-gradient(180deg,#1a2032 0%,#141827 18%,#0c0f1a 100%)}
.cground::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:#242c44}
.ctag{position:absolute;bottom:29%;left:6%;color:#2c3552;font-weight:900;font-size:20px;transform:rotate(-4deg);letter-spacing:2px}
.chour{position:absolute;top:56px;right:14px;z-index:4;font-size:12px;font-weight:700;color:#b3bcd0;text-shadow:0 1px 4px #000;opacity:.85}
.cempty{position:absolute;left:0;right:0;top:24%;text-align:center;color:#5a6480;font-size:13px;text-shadow:0 1px 4px #000}
.cperso{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:3;cursor:pointer;transform:translate(-50%,0) scale(var(--s,1));transform-origin:50% 100%;transition:left .6s cubic-bezier(.3,.8,.4,1),bottom .6s ease,transform .6s ease,opacity .4s}
.cperso.active{z-index:4;filter:drop-shadow(0 0 14px #4cc2ff55)}
.cperso.leave{opacity:0}
/* Le CRI du guetteur — « ARAH !! ». La seule bulle qui reste : les clients, on voit
   bien qu'ils sont là, une bulle par-dessus ne disait rien de plus que leur silhouette
   (retour de playtest, 2026-07-27). Le cri, lui, est un ÉVÉNEMENT : il annonce ce qui
   arrive, et il part de la rue avant que l'écran d'évacuation prenne la main. */
.cbulle{position:absolute;left:50%;transform:translate(-50%,-6px) scale(.6);
  border-radius:14px;padding:7px 11px;font-weight:800;line-height:1.25;
  white-space:normal;width:max-content;text-align:center;
  box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 0 2px #12121a;opacity:0;pointer-events:none;z-index:6;
  animation:bullePop .22s cubic-bezier(.2,1.5,.5,1) forwards}
.cbulle::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:7px solid transparent;filter:drop-shadow(0 2px 0 #12121a)}
.cbulle.out{animation:bulleOut .18s ease forwards}
.cbulle.cri{background:#ff4d4d;color:#fff;font-size:15px;letter-spacing:.06em}
.cbulle.cri::after{border-top-color:#ff4d4d}
@keyframes bullePop{0%{opacity:0;transform:translate(-50%,2px) scale(.6)}
  100%{opacity:1;transform:translate(-50%,-6px) scale(1)}}
@keyframes bulleOut{to{opacity:0;transform:translate(-50%,-14px) scale(.9)}}
.chead{width:38px;height:38px;border-radius:50%;background:#1b2234;display:flex;align-items:center;justify-content:center;font-size:22px;border:2.5px solid var(--ring,#2a3450)}
.cperso.active .chead{--ring:#4cc2ff}
.cbody{width:28px;height:40px;margin-top:-7px;border-radius:11px 11px 5px 5px;background:linear-gradient(180deg,#242e48,#151b2b)}
.clbl{font-size:10px;font-weight:700;margin-top:3px;color:#e8ecf4;text-shadow:0 1px 3px #000}
.cpat2{width:36px;height:3.5px;background:#232a3add;border-radius:3px;overflow:hidden;margin-top:3px}
.cpat2 i{display:block;height:100%;width:100%;background:#3ddc84}
.ctop{position:absolute;top:8px;left:8px;right:8px;z-index:22;display:flex;align-items:center;gap:6px} /* au-dessus du tiroir → le retour ↩ reste toujours cliquable */
.cbtn{border:0;border-radius:9px;background:rgba(0,0,0,.55);color:#e8ecf4;font:inherit;font-weight:700;font-size:12px;padding:8px 11px;cursor:pointer}
.cchip{background:rgba(0,0,0,.55);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.cchip.gold{color:#ffd66b}
/* moins de 20 s avant la descente : la chip se met à respirer — la pression se VOIT venir */
.cchip.hot{color:#ff8a6a;box-shadow:0 0 0 1px rgba(255,138,106,.45) inset;animation:chipPulse 1.1s ease-in-out infinite}
@keyframes chipPulse{0%,100%{opacity:1}50%{opacity:.55}}
#cManage{margin-left:auto}
#cActive{position:absolute;left:8px;right:8px;bottom:8px;z-index:8}
#cActive .card{margin:0;animation:cslide .26s cubic-bezier(.2,.9,.3,1.15)}
@keyframes cslide{from{transform:translateY(40px);opacity:0}}
.cdrawer-bk{position:absolute;inset:0;z-index:19;background:rgba(0,0,0,.5);display:none}
.cdrawer-bk.on{display:block}
/* panneau « Gérer » : plein écran quand ouvert (translateY 0), caché sinon (110%). Une poignée persistante
   « Le corner » (.cpeek) reste au-dessus de la barre du bas pour le rouvrir (tap ou glissement vers le haut). */
.cdrawer{position:absolute;left:0;right:0;bottom:0;z-index:20;background:rgba(24,20,16,.98);border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:12px 12px max(12px,env(safe-area-inset-bottom));transform:translateY(115%);transition:transform .28s cubic-bezier(.2,.9,.25,1);max-height:82%;overflow:auto}
.cdrawer.on{transform:translateY(0)}
/* poignée persistante (panneau fermé) : on la voit toujours, on la tire vers le haut / on tape pour ouvrir */
.cpeek{position:absolute;left:0;right:0;bottom:0;z-index:18;background:rgba(24,20,16,.96);border-radius:14px 14px 0 0;border-top:1px solid var(--line);padding:7px 12px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.cpeek .cdrawer-bar{margin:0}
.cpeek .cpeek-lb{font-size:12px;font-weight:800;color:#e8ecf4;letter-spacing:.2px}

   Ce que tu débites vaut moins que le pain dont il sort. Monter d'outil, c'est préserver.

   Ce n'est PAS une punition (R1) : il n'y a pas de raté possible, aucun gramme n'est
   jamais perdu, c'est simplement la ligne de base de l'outil que tu possèdes — l'état

// propre n'a plus d'usage (dette coupée). Elle reviendra plus tard, refondue en INVENTAIRE. → false

const money = n => String(Math.round(n));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

function defaultState(){
  return {
    cash: START_CASH, dirty:0, heat:0, reput:20, day:1, clock:0,
    pains:[{ g:PAIN_100.g, q:PAIN_100.q }], painSel:0, bars:{}, barQ:60, wasteG:0, // amorce : 1 plaquette à couper (core loop directe)
    rue:corner.RUE_MIN, rueMax:corner.RUE_MIN, annonce:null, // bouche-à-oreille : rueMax = ce qu'on demande (immédiat), rue = combien en demandent (progressif)

let S = defaultState();
if (store.get("ver") !== SAVE_VERSION) {
  Object.keys(localStorage).filter(k=>k.startsWith(LS)).forEach(k=>localStorage.removeItem(k));
  store.set("ver", SAVE_VERSION);
}
try { const raw=store.get("save"); if(raw) S={...defaultState(), ...JSON.parse(raw)}; } catch {}
// Migration douce v17 : painG (pool de grammes) → pains (liste discrète), sans reset
if(!Array.isArray(S.pains)) S.pains=[];
if(S.painG>0 && !S.pains.length) S.pains=[{ g:S.painG, q:S.painQ||60 }];
S.painG=0; S.painQ=0; // évite une double migration au prochain chargement
if(!(S.painSel>=0) || S.painSel>=S.pains.length) S.painSel=0;
if(!S.shelter) S.shelter=shelter.shelterDefaults();
else S.shelter={...shelter.shelterDefaults(), ...S.shelter};
// clientèle du corner : seed + migration douce (nouveaux personas ajoutés en cours de route)
if(!S.clients || typeof S.clients!=="object") S.clients=corner.cornerClientsDefault();
else for(const p of corner.CORNER_PERSONAS) if(!S.clients[p.id]) S.clients[p.id]={ rel:10, unlocked:!!p.start, missed:0, gougeStreak:0, quit:false };
// Save pré-Shelter : pas de cinématique front si déjà en course
if(!S.shelter.introSeen && (S.day>1 || shelter.stockG(S)>0 || (S.journal&&S.journal.length))){
  S.shelter.introSeen=true;
}

let tab="shelter", toastT=0, atelierSub="menu", cashSub="sorter", shelterSub="map";
/** Session trieuse (non persistée) — feel Kisan 4+1 fitness sorter. */
const sorter = { running:false, current:null, cooldown:0, combo:0, sessionOk:0, sessionRj:0, dirtyUi:false };
const stage=document.getElementById("stage");
const dock=document.getElementById("dock");
const toastEl=document.getElementById("toast");
const view3d=document.getElementById("view3d");
const buyOverlay=document.getElementById("buyOverlay");
const fmtBar=document.getElementById("fmtBar");

document.getElementById("skip3d").onclick=()=>{ // sortie de secours pendant le chargement
  atelierSub = atelierSub==="buy" ? "buy2d" : "cut2d";
  render();
};

function save(){ store.set("save", JSON.stringify(S)); }
// toastQ : annonces différées (ex. déblocage de contact) — jouées à la suite, sans couper le toast courant
let toastQ=[];
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastT);
  toastT=setTimeout(()=>{ toastEl.classList.remove("show"); if(toastQ.length) toastT=setTimeout(()=>toast(toastQ.shift()),250); },1800); }
function cause(txt, why){ S.journal.unshift({t:Date.now(),txt,cause:why}); if(S.journal.length>50) S.journal.length=50; }
function planqueCap(){ return PLANQUE_CAP_BASE + S.upgrades.planque*120; }
function sizesOf(map){ return Object.keys(map).map(Number).filter(f=>map[f]>0).sort((a,b)=>b-a); }
function barsG(){ return Object.entries(S.bars).reduce((a,[f,n])=>a+n*+f,0); }
function barCount(){ return Object.values(S.bars).reduce((a,n)=>a+n,0); }
function finiG(){ return barsG() + Object.entries(S.sachets).reduce((a,[f,n])=>a+n*+f,0); }
function avgMerge(oG,oQ,aG,aQ){ const t=oG+aG; return t<=0?0:(oG*oQ+aG*aQ)/t; }
function fmtBars(){ const ks=sizesOf(S.bars); return ks.length?ks.map(f=>`${S.bars[f]}×${f}g`).join(" · "):"—"; }
function activePain(){ return S.pains[S.painSel]||S.pains[0]||null; }
function painsG(){ return S.pains.reduce((a,p)=>a+p.g,0); }
function fmtPains(){ return S.pains.length?S.pains.map((p,i)=>`${i===S.painSel?"▶":""}${Math.round(p.g)}g`).join(" · "):"—"; }
/** Une coupe = une barrette, prise sur le PAIN ACTIF (partagé 3D / débit 2D).
    La qualité de CE pain part dans la barrette.
    Retourne les GRAMMES réellement débités (0 = rien à couper) : le pain actif
    peut être plus court que la taille demandée, et il peut être remplacé par le
    suivant en cours de série — seul ce retour dit la vérité au visuel. */
function applyCut(take, why){
  const p=activePain(); if(!p) return 0;
  take=Math.min(take,p.g); if(take<1) return 0;
  p.g-=take;
  // la lame décide de ce qui survit du pain : q_barrette = q_pain × netteté(couteau)
  S.barQ=avgMerge(barsG(),S.barQ,take,(p.q||60)*lameNettete());
  /* Bouche-à-oreille : la rue apprend le calibre que tu débites. On met à jour ICI,
     à la coupe, et pas à la vente — sinon rien ne pourrait s'amorcer (il faudrait
     avoir déjà vendu du gros pour que des acheteurs de gros se présentent), et
     chaque barrette coupée en avance serait du stock mort. Inertie pondérée par les
     grammes : quelques coupes ne retournent pas ta réputation, une série si. */
  S.rue=corner.rueApres(S.rue, take);
  /* La coupe ARME, elle n'annonce pas. C'est le joueur qui annonce, sur SnapShit.
     Pourquoi ce détour plutôt qu'un déclenchement direct à la première coupe : une
     réputation de calibre qui monte toute seule ne redescend jamais (`rueMax` est un
     maximum). Un faux clic sur le stepper de taille redéfinirait la clientèle pour
     de bon — une perte sèche issue d'une erreur de manipulation, silencieuse et
     irréversible. R1 l'interdit, et R8 aussi : ce ne serait pas une décision.
     En passant par l'annonce, le geste devient explicite, réversible (on annonce le
     petit calibre pour revenir), et il a enfin un coût de décision. */
  const nomme=corner.rueCalibre(take);
  if(nomme>corner.rueCalibre(S.rueMax||corner.RUE_MIN) && (!S.annonce||S.annonce.calibre!==nomme)){
    S.annonce={ calibre:nomme, jour:S.day };
    cause("Nouveau format en stock", `Premier ${nomme} g coupé — annonce-le sur SnapShit`);
    toastQ.push(`📣 Tu sors du ${nomme} g. Annonce-le sur SnapShit pour que la rue le demande.`);
  }
  const key=Math.max(1,Math.round(take));
  S.bars[key]=(S.bars[key]||0)+1;
  cause(`Coupe ${take.toFixed(1)} g`,`Barrette ${key} g — ${why}`);
  if(p.g<1){ S.pains.splice(S.pains.indexOf(p),1); S.painSel=0; } // pain fini → au suivant
  return take;
}
function cutBatch(){ return 1 + (S.upgrades.gabarit||0); } // barrettes par geste (gabarit, R2/R9)
function cutCap(){ return CUT_CAPS[Math.min(CUT_CAPS.length-1, S.upgrades.couteau||0)]; } // taille max de coupe (couteau)
function lameNettete(){ return LAME_NETTETE[Math.min(LAME_NETTETE.length-1, S.upgrades.couteau||0)]; } // ce que la lame préserve (R10)
/** « Ce pour quoi la rue te connaît » — le calibre débité et la part de gros paniers
    qu'il t'amène. Rendu tel quel : le joueur doit pouvoir relier son geste au trafic. */
function rueLabel(){
  const nomme=corner.rueCalibre(S.rueMax||corner.RUE_MIN);
  const part=Math.round(100*corner.ruePartGros(S.rue||corner.RUE_MIN));
  if(nomme<=corner.RUE_MIN) return `La rue : <b>petites doses</b>`;
  // les deux signaux, dits séparément : ce qu'on te demande, et combien en demandent
  return `La rue : <b>${nomme} g</b> · ${part} % de gros paniers`;
}
function fmtSachets(){ const ks=sizesOf(S.sachets); return ks.length?ks.map(f=>`${S.sachets[f]}×${f}g`).join(" · "):"—"; }
function qualAvg(){ return Math.round(S.sachetQ || S.barQ || 60); }

function hud(){
  const hudCash=document.getElementById("hudCash"); hudCash.style.display=SORTER_ENABLED?"":"none"; hudCash.textContent=`propre ${money(S.cash)}`;
  document.getElementById("hudDirty").textContent=`liquide ${money(S.dirty)}`;
  document.getElementById("hudHeat").textContent=`chaleur ${Math.round(S.heat)}`;
  document.getElementById("hudExpo").textContent=`buzz ${Math.round(S.expo)}`;
  { const dp=document.getElementById("daypill"); const f=Math.min(100,Math.round((S.dayAcc||0)/DAY_SEC_REAL*100)); dp.textContent=`J${S.day}`; dp.style.background=`linear-gradient(90deg, rgba(110,200,255,.30) ${f}%, transparent ${f}%)`; }
  const hitEl=document.getElementById("hudHit");
  const hit=shelter.stashHit(S, planqueCap());
  if(hit>0 || shelter.stockG(S)>0){
    const lb=shelter.hitLabel(hit);
    hitEl.style.display="";
    hitEl.textContent=`planque ${lb.txt}`;
    hitEl.className=`pill heat`;
  } else {
    hitEl.style.display="none";
  }
}

function renderDock(){
  dock.innerHTML=APPS.filter(t=>t.id!=="cash"||SORTER_ENABLED).map(t=>`<button class="tab ${tab===t.id?"on":""}" data-t="${t.id}"><span class="ic">${t.ic}</span>${t.lb}</button>`).join("");
  dock.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
    tab=b.dataset.t;
    atelierSub = tab==="atelier" ? "cut" : "menu"; // découpe = scène par défaut
    if(tab==="cash") cashSub="sorter";
    if(tab==="shelter") shelterSub="map"; // le dock Quartier ramène à la carte
    render();
  });
}

function set3d(mode){
  const on=mode!=="hidden";
  view3d.classList.toggle("on",on);
  stage.classList.toggle("behind",on);
  buyOverlay.classList.toggle("on", mode==="buy");
  fmtBar.classList.toggle("on", mode==="cut"); // sélecteur de taille de coupe
  if(mode==="cut") renderFmtBar();
  if(mode==="buy") renderBuyOverlay(); // liste dispo tout de suite, même si la 3D traîne
  if(mode==="hidden"){
    load3d.classList.remove("on");
    if(scene3d) scene3d.setMode("hidden");
    return;
  }
  if(!scene3d) load3d.classList.add("on"); // jamais d'écran noir muet pendant le chargement
  ensure3d().then((m)=>{
    load3d.classList.remove("on");
    if(tab!=="atelier"||(atelierSub!=="cut"&&atelierSub!=="buy")) return; // parti ailleurs entre-temps
    m.setMode(atelierSub);
    m.resize();
  }).catch(()=>{
    load3d.classList.remove("on");
    view3d.classList.remove("on");
    stage.classList.remove("behind");
    if(tab==="atelier"&&(atelierSub==="cut"||atelierSub==="buy")) render(); // no3d → routes 2D
  });
}
/** Taille de coupe — libre (CUT_MIN..CUT_MAX), défaut 2 g. Décidée ICI, pas au conditionnement.
    + ligne d'état : restant du pain actif, stock de pains, barrettes déjà coupées. */
function renderFmtBar(){
  if(!fmtBar.classList.contains("on")) return;
  const cap=cutCap();
  const cs=clamp(S.cutSize||CUT_DEFAULT, CUT_MIN, cap);
  if((S.cutSize||CUT_DEFAULT)!==cs){ S.cutSize=cs; save(); }
  const p=activePain();
  const others=S.pains.length-(p?1:0);
  fmtBar.innerHTML=`
    <button class="chip" data-d="-1">−</button>
    <span class="chip on" style="pointer-events:none">coupe ${cs} g</span>
    <button class="chip" data-d="1" ${cs>=cap?"disabled":""}>+</button>`
    +[2,5,8].map(x=>{ const lock=x>cap; return `<button class="chip ${cs===x?"on":""}" data-set="${x}" ${lock?"disabled":""}>${x}g${lock?" 🔒":""}</button>`; }).join("")
    +`<span class="chip cs">Couteau : max <b>${cap} g</b></span>`
    +`<span class="chip cs">${p?`Pain : <b>${Math.round(p.g)} g</b>`:"Pas de pain — appro"}${others>0?` · réserve ${others} pain${others>1?"s":""} (${Math.round(painsG()-(p?p.g:0))} g)`:""}</span>
    <span class="chip cs">Barrettes : ${fmtBars()}</span>`
    // Le bouche-à-oreille doit se VOIR pendant qu'on coupe : c'est la conséquence
    // directe du geste, et une conséquence invisible n'est pas une décision (R8).
    +`<span class="chip cs">${rueLabel()}</span>`;
  fmtBar.querySelectorAll("[data-d]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    S.cutSize=clamp((S.cutSize||CUT_DEFAULT)+ +b.dataset.d, CUT_MIN, cutCap());
    renderFmtBar(); save();
  });
  fmtBar.querySelectorAll("[data-set]").forEach(b=>b.onclick=e=>{
    e.stopPropagation(); S.cutSize=clamp(+b.dataset.set, CUT_MIN, cutCap()); renderFmtBar(); save();
  });
}

function render(){
  hud(); renderDock();
  stage.classList.remove("corner-mode"); // sort du mode scène (réactivé par renderCorner en Phase B)
  // 3D KO cette session → coupe/appro basculent sur leurs équivalents 2D
  if(tab==="atelier" && no3d){
    if(atelierSub==="cut") atelierSub="cut2d";
    if(atelierSub==="buy") atelierSub="buy2d";
  }
  if(tab==="atelier" && (atelierSub==="cut"||atelierSub==="buy")){
    set3d(atelierSub); stage.innerHTML=`<div class="card muted" style="margin:40px 12px">Chargement 3D…</div>`; return;
  }
  set3d("hidden");
  if(tab==="shelter" && shelterSub==="pdv") renderPDV();
  else if(tab==="shelter" || tab==="home") renderShelter();
  else if(tab==="snap") renderSnap();
  else if(tab==="atelier" && atelierSub==="bag") renderDoseBag();
  else if(tab==="atelier" && atelierSub==="dose") renderDoseFast();
  else if(tab==="atelier" && atelierSub==="cut2d") renderCut2D();
  else if(tab==="atelier" && atelierSub==="buy2d") renderBuy2D();
  else if(tab==="atelier") renderAtelierMenu();
  else if(tab==="beuher") renderBeuher();
  else if(tab==="cash") renderCashSorter();
}

      <button class="app atelier" data-go="atelier"><div class="icon">✂</div><div class="nm">Atelier</div></button>
      <button class="app beuher" data-go="beuher"><div class="icon">🛵</div><div class="nm">Beuher</div></button>

      <button class="app karnet" data-go="karnet"><div class="icon">📓</div><div class="nm">Karnet</div></button>
    </div>
    <div class="card">
      <h3>Réinvest</h3>

    </div>

  stage.querySelectorAll(".map-pin").forEach(b=>b.onclick=()=>{

  stage.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{

/* ============ PDV — le corner : point de vente à 3 curseurs (CADRE) ============

   de BARRETTES (sachets) depuis le TAMPON exposé → bac (liquide de rue) → ledger.
   Menu = vitrine SnapShit (buzz). Descente au seuil : saisit tampon + bac.
   Constantes de réglage (placeholders) : */
const PDV_BASE_DEMAND=200;        // clients/h à réservoir plein, prix juste
const PDV_TIME_COMPRESS=20;       // temps de jeu accéléré (fait vivre le débit)
const PDV_RUSH_AMP=1.3, PDV_RUSH_PERIOD=38; // pics de rush cycliques
const PDV_EXPO_SCALE=140;         // buzz (vitrine SnapShit) → demande
const PDV_SERVE_RATE=4;           // clients servis/s (débit du corner)
const PDV_MAX_WAIT=5, PDV_MAX_QUEUE=14, PDV_RES_PER_SALE=0.05, PDV_RUPTURE_HIT=1.2;

/* Le chouffe achète du PRÉAVIS, plus de l'immunité (arbitrage Sylvain, 2026-07-26).

const PDV_CHOUFFE_DAMP=0.18, PDV_CHOUFFE_PAY=60, PDV_TAMPON_MAX=60; // barrettes

const SAC_LOT=25;
const PDV_PREAVIS_S=[0, 6, 12, 18];   // [PLACEHOLDER] secondes de préavis selon le nombre de chouffes
const ARAH_COOL_MS=520;                // le temps de rentrer un bloc : on ne sauve jamais tout, et ça se voit
const ARAH_LOT=8;                      // barrettes rentrées par tap (les grosses d'abord : on sauve la valeur)
const PDV_WANT=[1,1,2,1,3,2,1,2]; // paniers clients (barrettes)
const PDV_NAMES=["Momo","Inès","Yaz","Riton","Sofia","Sami","Lou","Nassim","Aya","Karim","Zoé","Paul"]; // plus de "Diego" : il ne fait plus la rue
const PDV_AV=["🧢","🎧","🛵","🥀","💅","🎒","👟","🎲","🌙","🧥","🎀","👤"]; // plus de 🏗️ : Diego ne vient plus au corner // avatars des silhouettes (débit auto : charbonneur embauché)
const PDV_ADV=[{q:25,l:"Merdique"},{q:45,l:"Correct"},{q:62,l:"Bonne"},{q:78,l:"Top"}];
const pdvFair=q=>5+q*0.10;
const tampN=t=>Object.values(t||{}).reduce((a,n)=>a+n,0);      // barrettes au tampon
const tampG=t=>Object.entries(t||{}).reduce((a,[f,n])=>a+n*+f,0); // grammes au tampon
const pdvRush=()=>1+PDV_RUSH_AMP*(0.5+0.5*Math.sin((S.clock||0)*2*Math.PI/PDV_RUSH_PERIOD));
const pdvRushHot=()=>pdvRush()>1+PDV_RUSH_AMP*0.7;

// marché du jour (concurrence) — bouge chaque matin, annoncé à la clôture (déterministe, R4)
function marcheDuJour(){ return corner.marketPrice(S.reput, S.day); }
function pdvDemande(){
  const P=S.shelter.pdv; const Qd=tampN(P.tampon)>0?P.tamponQ:(S.sachetQ||55); const Qa=P.advQ||Qd;
  // le PRIX pilote la demande, RELATIVE au marché du jour : pente raide autour de prix=marché —
  // suivre (ou pas) la concurrence doit se sentir. Baseline inchangée à prix=marché (attract 0.8).
  const pr=P.prix/marcheDuJour(); const attract=clamp(0.8-(pr-1)*0.9,0.12,1.35);
  const buzz=1+(S.expo||0)/PDV_EXPO_SCALE;
  return PDV_BASE_DEMAND*(P.res/100)*attract*buzz*pdvRush();
}
// sert un client (le premier de la file) : débite des barrettes du tampon
function pdvServe(P){
  const cl=P.queue.shift(); if(!cl) return;
  const { n, g }=cornerTakeG(P, cl.g);   // même unité que la négo : des grammes
  if(g===0){ P.res=clamp(P.res-PDV_RUPTURE_HIT,0,100); return; } // rupture : rien à vendre
  const price=Math.round(g*corner.menuAt(P.prix, g)); P.bac+=price; // même barème volume que la négo
  const Qd=P.tamponQ||S.sachetQ||55, Qa=P.advQ||Qd, pr=P.prix/pdvFair(Qa);
  const content=clamp(0.55+(Qd-Qa)*0.010-0.8*Math.max(0,pr-1),0,1);
  P.res+=(content*100-P.res)*PDV_RES_PER_SALE;
  P.ledger.unshift({nm:cl.nm,n,g,eur:price}); if(P.ledger.length>6) P.ledger.length=6;
}
/* ---------- Le Corner — négo présentielle (joueur présent) : porté de le-corner/ ----------
   Quand tu tiens TON corner, la carte client remplace la vente auto :
   offre vs menu, accepter / contrer (steppers de prix) / refuser, zones déterministes.
   Le débit auto (pdvServe) ne sert plus que le charbonneur embauché (plus tard). */
const CORNER_MAX_QUEUE=6;   // on sert un client à la fois → file courte
const CORNER_ARRIVAL=3.2;   // arrivées négo : quelques clients/soirée (pas le flux auto)
function cornerActive(P){ return P.queue&&P.queue.length?P.queue[0]:null; }
/* Débite EXACTEMENT `targetG` grammes du tampon, en composant avec les barrettes
   disponibles (tailles libres, fixées à la coupe). Si aucune combinaison exacte
   n'existe, on sert le meilleur sous-total ATTEIGNABLE — jamais plus que demandé.

   C'EST LE LEVIER DE CALIBRE, pas seulement une réparation : en vente À LA TÊTE,
   le calibre ne change pas le nombre de transactions, il change QUI tu peux
   servir. Un stock de 8 g ne sert pas Riton qui veut 2 g. Couper petit = servir
   tout le monde et travailler plus à la planche ; couper gros = expédier la
   coupe et fermer la porte à une partie de la clientèle.

   Avant : on comptait des barrettes via clamp(round(g/2),1,6) — Diego payait
   24 g et recevait 12 g (50 %), un client de 3 g en recevait 4 (133 %).
   Le patron correct existait déjà deux fois dans le dépôt (pdvServe, snap.mjs). */
// lecture seule : ce que le tampon peut composer pour cette commande
function cornerComposable(P, targetG){
  const target=Math.max(0,Math.round(targetG));
  if(target<=0) return { exact:true, covered:0, short:0 };
  const { covered }=snap.qtyToSachets(target, { ...P.tampon });
  return { exact:covered===target, covered, short:target-covered };
}
function cornerTakeG(P, targetG){
  const target=Math.max(0,Math.round(targetG));
  if(target<=0) return {n:0,g:0};
  const { plan, covered }=snap.qtyToSachets(target, P.tampon);
  if(covered<=0) return {n:0,g:0};
  let n=0; for(const f of Object.keys(plan)) n+=plan[f]||0;
  snap.applySachetPlan(P.tampon, plan);
  return { n, g:covered };
}
/* La qualité que le client renifle À L'ARRIVÉE : celle du tampon si tu es ravitaillé,
   sinon celle de ton stock. C'est elle qui fixe sa tolérance (corner.qualFac) — pas ton prix. */
function cornerQNow(P){ return Math.round(tampN(P.tampon)>0?P.tamponQ:(S.sachetQ||55)); }
function cornerSpawn(P){ // client (persona ou louche) + sa demande (déterministe)
  // profil cramé (louche) : à partir de J2, apparition déterministe, un seul à la fois
  if(S.day>=corner.CORNER.LOUCHE_FROM_DAY && !P.queue.some(c=>c.kind==="louche") && cornerHash(S.day*3, P.seq)>1-corner.CORNER.LOUCHE_CHANCE){
    const L=corner.makeLouche(S.day, P.seq, S.reput, P.prix), pat=corner.patienceOf("louche");
    return { cid:null, nm:L.nm, av:L.av, kind:"louche", rel:0, g:L.qty, offer:L.offer, tx:L.tx, tell:L.tell, cop:L.cop, pat, pat0:pat, mode:"louche", negoP:L.offer, dernier:null };
  }
  // heures de passage (traits.hours) : le cycle 24h filtre QUI passe ; une ardoise ouverte = il se fait discret
  const hourNow=cornerHourN(cornerDayT());
  const avail=corner.CORNER_PERSONAS.filter(p=>{ const c=S.clients[p.id];
    return c&&c.unlocked&&!c.quit&&!c.ardoise&&p.canal!=="dm"&&corner.inHours(p, hourNow)
      && !P.queue.some(q=>q.cid===p.id); }); // canal "dm" = il écrit, il ne fait pas la queue (grossiste)
  // PNJ anonyme (le volume : vient chercher sa dose, sans plus) vs persona nommé (le sel) — tirage déterministe
  if(!avail.length || cornerHash(S.day*11, P.seq) < corner.CORNER.ANON_SHARE){
    const a=corner.makeAnon(S.day, P.seq, S.reput, P.prix, S.rue, S.rueMax), i=P.seq, pat=corner.patienceOf("anon");
    // 85 % du volume : c'est ICI que la qualité doit se sentir, pas seulement chez les 2 connaisseurs
    return { cid:null, nm:PDV_NAMES[i%PDV_NAMES.length], av:PDV_AV[i%PDV_AV.length], kind:"anon", rel:0,
      g:a.qty, offer:a.offer, tx:a.tx, tell:"", pat, pat0:pat, mode:"offer", negoP:a.offer, dernier:null,
      qFac:corner.qualFac(cornerQNow(P)) };
  }
  const p=avail[(P.seq)%avail.length], c=S.clients[p.id];
  // ardoise (étape 4) : soir de dèche déterministe → il demande son habituel à crédit (règle à J+N, +intérêt)
  if(corner.wantsArdoise(p, c.rel, S.day, P.seq)){
    const a=corner.makeArdoise(p, c.rel, S.reput, S.day, P.seq, P.prix), pat=corner.patienceOf(p.kind);
    return { cid:p.id, nm:p.nm, av:p.av, kind:p.kind, rel:c.rel, pat, pat0:pat, mode:"ardoise", tx:a.tx, tell:a.tell,
      g:a.qty, due:a.due, payday:a.payday, offer:0, negoP:0, dernier:null };
  }
  const o=corner.makeOffer(p, c.rel, S.reput, S.day, P.seq, P.prix), pat=corner.patienceOf(p.kind);
  const base={ cid:p.id, nm:p.nm, av:p.av, kind:p.kind, rel:c.rel, pat, pat0:pat, mode:o.mode, tx:o.tx, tell:o.tell, dernier:null };
  // traits lisibles sur la carte (R4) : chaleur à la vente ; qualité reniflée À L'ARRIVÉE (tampon du moment)
  if(p.traits&&p.traits.heat) base.heatAdd=p.traits.heat;
  const qNow=cornerQNow(P), qc=corner.qualCheck(p, qNow);
  if(qc) base.qc=qc;
  // tolérance = qualité du produit (TOUT le monde la sent) × jugement du connaisseur (2 personas).
  // Avant, seuls Inès et Lina réagissaient à la qualité : on la payait ×3,4 le gramme
  // pour ~2 % des clients. Le tuyau qFac existait déjà, il ne servait qu'à eux.
  base.qFac=corner.qualFac(qNow)*(qc?qc.fac:1);
  // le connaisseur déçu rogne sa tolérance APRÈS que l'offre soit formée : on
  // re-borne, sinon il refuse le montant qu'il vient lui-même d'annoncer
  if(base.qFac && base.qFac !== 1 && o.mode==="offer")
    o.offer=Math.min(o.offer, corner.offerCap(p.kind, c.rel, corner.menuAt(P.prix||corner.cornerFair(S.reput), o.qty), o.qty, base.qFac));
  if(o.mode==="hesit") return { ...base, g:o.usual, usual:o.usual, offer:0, negoP:0 };
  if(o.mode==="ambig") return { ...base, g:0, expect:o.expect, composeG:0, offer:0, negoP:0 };
  return { ...base, g:o.qty, offer:o.offer, negoP:o.offer };
}
/* --- mise en scène rue (Option B) : silhouettes, fenêtres allumées, priorisation --- */
const CORNER_SLOTS=[{l:30,b:20,s:1.06},{l:54,b:24,s:.9},{l:66,b:26,s:.82},{l:76,b:28,s:.76},{l:85,b:30,s:.7},{l:92,b:31,s:.65}];

function cornerHash(a,b){ let x=(a*73856093)^(b*19349663); x=((x^(x>>13))*1274126177)|0; return (((x^(x>>16))>>>0)%100000)/100000; }
function cornerLitWindows(){ // fenêtres allumées déterministes par soirée

/* Retour haptique. R3 : le tactile EST le plaisir — une conséquence qu'on sent dans
   la main se lit avant d'être lue. Les motifs disent QUOI s'est passé sans regarder :

   tout est enveloppé, rien ne dépend de sa présence. */
function haptic(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(_){} }
const HAPTIC={ bulle:8, deal:22, juste:[18,50,18], walk:[30,60,30], cri:[70,50,70,50,120] };

function cornerSilhouette(cl){
  const pe=document.createElement("div"); pe.className="cperso"; pe.dataset.k=cl.kind;
  pe.style.left="108%"; pe.style.bottom="26%"; pe.style.setProperty("--s",0.7);
  pe.innerHTML=`<div class="chead">${cl.av||"👤"}</div><div class="cbody"></div><div class="clbl">${cl.nm}</div><div class="cpat2"><i></i></div>`;
  pe.onclick=()=>{ const P=S.shelter.pdv; cornerPrioritize(P, cl); };
  return pe;
}
function cornerLayoutPersos(P){

  for(const cl of P.queue){ if(!cornerEls.has(cl)){ const el=cornerSilhouette(cl); cornerEls.set(cl,el); host.appendChild(el);

  P.queue.forEach((cl,i)=>{ const el=cornerEls.get(cl); if(!el) return; const s=CORNER_SLOTS[Math.min(i,CORNER_SLOTS.length-1)];
    el.style.left=s.l+"%"; el.style.bottom=s.b+"%"; el.style.setProperty("--s",s.s); el.classList.toggle("active",i===0);
    const pi=el.querySelector(".cpat2 i"); if(pi){ const r=clamp(cl.pat/cl.pat0,0,1); pi.style.width=(r*100)+"%"; pi.style.background=r>0.5?"#3ddc84":r>0.22?"#ffd06a":"#ff6a6a"; } });
  const empty=document.getElementById("cEmpty"); if(empty) empty.style.display=P.queue.length?"none":"block";
}
function cornerPrioritize(P, cl){ // tap une silhouette de la file → la servir en premier (Overcooked)
  const i=P.queue.indexOf(cl); if(i<=0) return;
  P.queue.splice(i,1); P.queue.unshift(cl);

}
function cornerNegoTick(P, dt, demande, open){
  const was=cornerActive(P);
  if(open){
    P.qacc=(P.qacc||0)+demande*dt*CORNER_ARRIVAL/3600;
    while(P.qacc>=1 && P.queue.length<CORNER_MAX_QUEUE){ P.qacc-=1; P.seq=(P.seq||0)+1; const cl=cornerSpawn(P); if(cl) P.queue.push(cl); else break; }
    if(P.qacc>CORNER_MAX_QUEUE) P.qacc=CORNER_MAX_QUEUE;
  } else P.qacc=0;
  let expired=0;
  const waiting=cl=>cl.mode!=="nego"&&cl.mode!=="dernier"; // gelé pendant qu'on négocie/dernier prix
  for(let i=0;i<P.queue.length;i++){ const cl=P.queue[i]; if(!waiting(cl)) continue; cl.pat-=dt*(i===0?1:corner.CORNER.QUEUE_MELT); }
  const keep=[];
  for(const cl of P.queue){ if(waiting(cl)&&cl.pat<=0){ expired++; if(cl.cid&&S.clients[cl.cid]) S.clients[cl.cid].missed++; } else keep.push(cl); }
  // R1 : un client qui se lasse est une VENTE PERDUE, pas une amende. Ponctionner
  // `res` (qui pilote la demande) punissait la LENTEUR DE LA MAIN — exactement ce
  // que R1 interdit. Le walk après une contre-offre trop haute, lui, reste sanctionné :
  // il est annoncé par negoFace avant le bouton, donc c'est une décision (R8).
  if(expired){ P.queue=keep; P.combo=1; }
  if(cornerActive(P)!==was) renderCornerActive(P); else cornerPatchActive(P);
  cornerLayoutPersos(P); // positionne les silhouettes + jauges de patience
}
function applyDeltas(cl, v){
  const c=S.clients[cl.cid]; if(!c) return;
  if(v.rel) c.rel=clamp(c.rel+v.rel,0,100);
  if(v.reput) S.reput=clamp(S.reput+v.reput,0,100);
  if(v.res){ const P=S.shelter.pdv; P.res=clamp(P.res+v.res,0,100); }
  if(v.resetGouge) c.gougeStreak=0;
  if(v.gouge){ c.gougeStreak=(c.gougeStreak||0)+1; if(c.gougeStreak>=corner.CORNER.GOUGE_STREAK_QUIT){ c.quit=true; toast("💔 "+cl.nm+" ne reviendra plus (trop d'abus)."); } }

      +u.p.nm+(u.p.canal==="dm"?" va t'écrire sur SnapShit.":" passera te voir"+(hl?" ("+hl+")":"")+".")); }

// vente commune : débite targetG GRAMMES du tampon → liquide direct + ledger. false si rupture.
// Présentiel (joueur au corner) : tu es là, l'argent tombe direct en liquide — aucun « encaisser » à taper (R6/R7).
// (Le bac ne sert plus qu'au charbonneur embauché plus tard : corner qui tourne en ton absence → recette à ramasser.)
function cornerSell(P, cl, targetG, total, tip){
  const sold=cornerTakeG(P, targetG);
  if(sold.g===0){ P.res=clamp(P.res-PDV_RUPTURE_HIT,0,100); cornerLeave(P, cl, "rupture"); return false; }
  // rupture partielle : on ne facture JAMAIS ce qu'on n'a pas livré (au prorata)
  const eur=sold.g<targetG ? Math.round(total*sold.g/targetG) : total;
  const gain=eur+(tip||0);
  S.dirty+=gain; pushBills(gain);
  P.ledger.unshift({nm:cl.nm, n:sold.n, g:sold.g, eur:gain}); if(P.ledger.length>6) P.ledger.length=6;

}
/* La quantité RÉELLEMENT proposée. Par défaut celle qu'il demande, mais le joueur

   font pas 5 g). Aucune pénalité n'est nécessaire : le budget du client est
   indépendant de la quantité, donc lui vendre plus que sa poche ne peut pas encaisse
   plus — ça encaisse la MÊME somme sur plus de grammes, et le €/g s'effondre.
   Un anonyme à 55 € de budget : 2 g → 11,00 €/g, 8 g → 6,88 €/g, 20 g → 2,75 €/g.
   L'arbitrage est là, entier : écouler du stock bâtard, ou tenir son prix (R8). */
function propG(cl){ return Math.max(0, cl.propG!=null ? cl.propG : cl.g); }
/* Les quantités proposables : celles que le tampon compose EXACTEMENT, bornées par

function cornerQuantites(P, cl){
  const menu=P.prix||marcheDuJour();
  const bud=corner.cornerBudget(cl.kind, cl.rel||0);
  let poche=1;
  for(let g=1; g<=60; g++) if(g*corner.menuAt(menu,g)<=bud) poche=g;
  const cap=Math.max(cl.g, poche);
  const liste=snap.composables(P.tampon||{}, cap);
  if(!liste.includes(cl.g) && cl.g>0) liste.push(cl.g);
  return liste.sort((a,b)=>a-b);
}
function cornerResolve(P, cl, total, firstTry, isClientOffer){
  const g=propG(cl);
  const v=corner.resolveOffer(cl, g, total, firstTry, isClientOffer, S.reput, P.prix);
  if(v.outcome==="counter"){ cl.countered=true; cl.dernier=v.counterTotal; cl.mode="dernier"; renderCornerActive(P); toast("Il contre — dernier prix "+v.counterTotal); return; }
  if(v.outcome==="walk"){ applyDeltas(cl, v); P.combo=1; cornerLeave(P, cl, "walk", v); return; }
  let tip=0;
  if(v.tipRate){ tip=Math.round(total*v.tipRate*(P.combo||1)); }
  if(cl.qc&&cl.qc.ok&&v.outcome!=="gouge") tip+=Math.round(total*corner.CORNER.TIP_QUAL); // le connaisseur paie le propre
  if(!cornerSell(P, cl, g, total, tip)) return;
  if(v.tipRate) P.combo=Math.min(corner.CORNER.COMBO_MAX,(P.combo||1)+corner.CORNER.COMBO_STEP);
  applyDeltas(cl, v);
  if(cl.qc&&cl.qc.ok&&v.outcome!=="gouge"){ const c=S.clients[cl.cid]; if(c) c.rel=clamp(c.rel+1,0,100); }
  if(cl.heatAdd){ S.heat=clamp(S.heat+cl.heatAdd,0,100); cause("Le coin chauffe", cl.nm+" · chaleur +"+cl.heatAdd); }
  cause("Vente corner", cl.nm+" · "+v.outcome+" +"+(total+tip));
  cornerLeave(P, cl, "done", v, tip);
}
// louche : vendre → chaleur (ni relation ni combo) ; refuser → discrétion (petit liquide)
// vendre au louche : cop:false = pigeon légitime (grosse vente propre, zéro chaleur) ; sinon (vrai flic / doute) → chaleur
function cornerResolveLouche(P, cl){
  if(!cornerSell(P, cl, cl.g, cl.offer, 0)) return;
  P.combo=1;
  if(cl.cop===false){ S.reput=clamp(S.reput+corner.CORNER.REP_DEAL,0,100); cause("Grosse vente", cl.nm+" +"+cl.offer+" · client réglo"); cornerLeave(P, cl, "pigeon"); }
  else { S.heat=clamp(S.heat+corner.CORNER.HEAT_LOUCHE,0,100); cause("Vente cramée", cl.nm+" +"+cl.offer+" · chaleur +"+corner.CORNER.HEAT_LOUCHE); cornerLeave(P, cl, "louche"); }
}
// refuser le louche : cop:false = t'as recalé un vrai client (juste une vente perdue, R1) ; sinon t'as flairé le flic (+discrétion)
function cornerFlair(P, cl){
  if(cl.cop===false){ P.combo=1; cornerLeave(P, cl, "pigeonRefus"); }
  else { S.dirty+=corner.CORNER.FLAIR_BONUS; cause("Flic flairé","+"+corner.CORNER.FLAIR_BONUS+" discrétion"); cornerLeave(P, cl, "flair"); }
}
// ardoise (étape 4) : le stock part MAINTENANT, l'argent revient à J+N (+intérêt) — réglé à la clôture
// de journée, jamais d'impayé (R4). Refuser = vente perdue, aucun malus (R1).
function cornerResolveArdoise(P, cl){
  const sold=cornerTakeG(P, cl.g);
  if(sold.n===0){ P.res=clamp(P.res-PDV_RUPTURE_HIT,0,100); cornerLeave(P, cl, "rupture"); return; }
  if(sold.g<cl.g) cl.due=Math.max(1,Math.round(cl.due*sold.g/cl.g)); // rupture partielle : dette au prorata des grammes partis (R4)
  const c=S.clients[cl.cid];
  // cumul (jamais d'écrasement de dette → jamais d'impayé) — ne devrait plus arriver avec la file dédoublonnée
  if(c){ c.ardoise = c.ardoise ? { due:c.ardoise.due+cl.due, day:Math.max(c.ardoise.day, cl.payday) } : { due:cl.due, day:cl.payday };
    c.rel=clamp(c.rel+corner.CORNER.REL_DEAL,0,100); }
  P.queue=P.queue.filter(x=>x===cl||x.cid!==cl.cid); // il se fait discret tant qu'il doit : ses autres cartes s'en vont
  P.ledger.unshift({nm:cl.nm, n:sold.n, g:sold.g, eur:0, ard:"J"+cl.payday}); if(P.ledger.length>6) P.ledger.length=6;
  cause("Ardoise ouverte", cl.nm+" · "+cl.due+" à J"+cl.payday);
  cornerLeave(P, cl, "ardoise");
}
// hésitant : toute attention convertit ; son habituel (perso) paie un pourboire
function cornerResolveHesit(P, cl, perso){
  const fair=P.prix||marcheDuJour(), g=perso?cl.usual:2, total=Math.round(g*fair);
  const tip=perso?Math.round(total*corner.CORNER.TIP_LU):0;
  if(!cornerSell(P, cl, g, total, tip)) return;
  const c=S.clients[cl.cid]; if(c) c.rel=clamp(c.rel+(perso?corner.CORNER.REL_PERSO:corner.CORNER.REL_DEAL),0,100);
  S.reput=clamp(S.reput+corner.CORNER.REP_DEAL,0,100);

// ambigu : le joueur compose ; bien lu (grammes == attendu) → pourboire, sinon vendu quand même (R1)
function cornerResolveAmbig(P, cl){
  const fair=P.prix||marcheDuJour(), g=cl.composeG||0;
  if(g<=0){ toast("Ajoute au moins une barrette."); return; }
  const total=Math.round(g*fair), lu=(g===cl.expect);
  let tip=lu?Math.round(total*corner.CORNER.TIP_LU*(P.combo||1)):0;
  if(lu&&cl.qc&&cl.qc.ok) tip+=Math.round(total*corner.CORNER.TIP_QUAL); // connaisseur bien servi ET bien lu
  if(!cornerSell(P, cl, g, total, tip)) return;
  const c=S.clients[cl.cid];
  if(lu){ if(c) c.rel=clamp(c.rel+corner.CORNER.REL_JUSTE+1,0,100); P.combo=Math.min(corner.CORNER.COMBO_MAX,(P.combo||1)+corner.CORNER.COMBO_STEP); }
  else if(c) c.rel=clamp(c.rel+1,0,100);
  S.reput=clamp(S.reput+corner.CORNER.REP_DEAL,0,100);
  cornerLeave(P, cl, "done", {emo:lu?"🎯":"😶", outcome:lu?"lu":"mouais"}, tip);

function cornerAct(P, a){
  const cl=cornerActive(P); if(!cl) return;
  if(a==="refuse"||a==="refuse2") return cornerLeave(P, cl, "refus");
  if(a==="cancel"){ cl.mode="offer"; return renderCornerActive(P); }
  if(a==="counter"){
    cl.mode="nego";
    // point de départ utile : sa demande si on peut la composer, sinon ce qu'on PEUT
    // réellement servir — c'est justement le cas où le joueur ouvre cet écran.
    if(cl.propG==null){
      // on ouvre sur le composable le plus proche de sa demande : quand le tampon
      // ne fait que du 8 g et qu'il en veut 5, la carte s'ouvre DÉJÀ sur 8 g.
      const liste=cornerQuantites(P, cl);
      cl.propG = liste.length
        ? liste.reduce((a,b)=>Math.abs(b-cl.g)<Math.abs(a-cl.g)?b:a)
        : cl.g;
    }
    const gp=propG(cl);
    cl.negoP = gp===cl.g ? cl.offer : Math.max(1, Math.round(gp*corner.menuAt(P.prix||marcheDuJour(), gp)));
    return renderCornerActive(P);
  }
  if(a==="accept") return cornerResolve(P, cl, cl.offer, true, true);
  if(a==="send"){ const first=!cl.countered; cl.mode="offer"; return cornerResolve(P, cl, cl.negoP, first, false); }
  if(a==="accept2") return cornerResolve(P, cl, cl.dernier, false, true);
  if(a==="loucheOk") return cornerResolveLouche(P, cl);
  if(a==="loucheNo") return cornerFlair(P, cl);
  if(a==="ardoiseOk") return cornerResolveArdoise(P, cl);
  if(a==="hesitPerso") return cornerResolveHesit(P, cl, true);
  if(a==="hesitGen") return cornerResolveHesit(P, cl, false);
  if(a==="compSell") return cornerResolveAmbig(P, cl);
}

function pdvTick(dt){

  // PRÉSENCE REQUISE : au début, le charbonneur c'est TOI — tu ne vends au corner
  // que quand tu le tiens (écran corner). Vendre au corner ⇄ vendre/livrer sur
  // SnapShit = un arbitrage de ta présence. L'embauche d'un charbonneur (plus tard)
  // posera S.upgrades.charbonneur et fera tourner le corner en fond (le reste du
  // tick gère déjà ce cas : file, ventes, bac, badge sur le pin).
  const held=tab==="shelter"&&shelterSub==="pdv";
  if(!held && !(S.upgrades&&S.upgrades.charbonneur)) return; // pas là & pas de charbonneur → corner fermé
  if(!P.queue) P.queue=[]; if(!P.ledger) P.ledger=[]; if(!P.tampon) P.tampon={};
  const open=tampN(P.tampon)>0;   // on ne vend que s'il y a de quoi (tampon ravitaillé)
  const demande=pdvDemande();
  const nego = held; // présent → négo au client ; absent (charbonneur embauché, plus tard) → débit auto
  if(nego){
    cornerNegoTick(P, dt, demande, open); // arrivées personas + patience + carte active (pas d'auto-serve)
  } else {
    // débit AUTO (charbonneur embauché, plus tard : le corner tourne en fond, joueur absent)
    if(open){
      P.qacc=(P.qacc||0)+demande*dt*PDV_TIME_COMPRESS/3600;
      while(P.qacc>=1 && P.queue.length<PDV_MAX_QUEUE){ P.qacc-=1; P.seq=(P.seq||0)+1; P.queue.push({nm:PDV_NAMES[P.seq%PDV_NAMES.length], av:PDV_AV[P.seq%PDV_AV.length], want:PDV_WANT[P.seq%PDV_WANT.length], wait:0}); }
      if(P.qacc>PDV_MAX_QUEUE) P.qacc=PDV_MAX_QUEUE;
    } else P.qacc=0;
    P.serveAcc=(P.serveAcc||0)+PDV_SERVE_RATE*dt;
    while(P.serveAcc>=1 && P.queue.length){ P.serveAcc-=1; pdvServe(P); }
    for(const cl of P.queue) cl.wait=(cl.wait||0)+dt;
    const before=P.queue.length; P.queue=P.queue.filter(c=>(c.wait||0)<PDV_MAX_WAIT);
    if(P.queue.length<before) P.res=clamp(P.res-PDV_RUPTURE_HIT*(before-P.queue.length),0,100);
  }
  // Heat : le corner ne chauffe que quand il tourne (à sec → il refroidit), amortie par les chouffes
  const activity=open ? clamp(demande/PDV_BASE_DEMAND + P.queue.length*0.04, 0, 1.6) : 0;
  S.heat=clamp(S.heat+(activity*PDV_HEAT_RATE/(1+(P.chouffes||0)*PDV_CHOUFFE_DAMP)-PDV_HEAT_DECAY)*dt,0,100);
  if(S.heat>=PDV_SEUIL && !arahState){
    // le chouffe achète des SECONDES, pas l'immunité : sans lui, la descente tombe sec
    const pre=PDV_PREAVIS_S[Math.min(P.chouffes||0, PDV_PREAVIS_S.length-1)];
    if(pre>0) arahOuvrir(pre); else pdvDescente();
    return;
  }

// badge « bac de rue » sur le pin corner (la recette passive, visible depuis la carte)
function pdvBadge(P){ const b=document.getElementById("pinBac"); if(b){ b.textContent="€"+money(P.bac); b.classList.toggle("off",!(P.bac>0)); } }
/* Le temps qu'il te reste avant la descente, à la vitesse de CET instant.
   C'était le grand absent : la chaleur n'était affichée que comme un entier brut, et
   toute la couche de mise à jour live (pRes, pDem, pQ, pCombo, pHeat…) patchait des
   identifiants disparus du markup — sept sur huit écrivaient dans le vide. D'où le
   ressenti « parfois trop rapide » : ce n'est pas la vitesse qui est mauvaise, c'est
   qu'elle est invisible ET qu'elle varie ×3,5 avec le rush. Une pression qu'on voit
   venir est tendue ; une pression qu'on subit est injuste (R8 : un système qui décide
   dans le dos du joueur n'est pas une décision). */
function pdvVitesseHeat(P){
  const activity=clamp(pdvDemande()/PDV_BASE_DEMAND + (P.queue?P.queue.length:0)*0.04, 0, 1.6);
  return activity*PDV_HEAT_RATE/(1+(P.chouffes||0)*PDV_CHOUFFE_DAMP)-PDV_HEAT_DECAY;
}
function heatChipTxt(P){
  const v=pdvVitesseHeat(P), h=Math.round(S.heat);
  if(v<=0.001) return `🔥 ${h} · stable`;                    // les chouffes absorbent tout
  const s=Math.max(0,(PDV_SEUIL-S.heat)/v);
  return `🔥 ${h} · ${s<1?"<1":Math.round(s)} s${pdvRushHot()?" ⚡RUSH":""}`;
}
/* Le réservoir, c'est-à-dire ta clientèle : il monte à chaque bonne vente et c'est LUI
   qui raccourcit ton créneau. Sans l'afficher, le joueur voit son temps fondre au fil
   des jours sans comprendre que c'est son propre succès qui le lui prend (R9). */
function resChipTxt(P){ return `👥 ${Math.round(P.res)}`; }
/* Ce qu'un chouffe de plus t'achète, dit en SECONDES d'ouverture — pas en « −Heat ».
   C'est le barreau R2 de l'escalier au corner, et il était illisible : personne ne peut
   deviner que passer de 0 à 1 chouffe fait passer de 49 s à 119 s. */
function chouffeGain(P){
  const sec=(c)=>{
    const activity=clamp(pdvDemande()/PDV_BASE_DEMAND + (P.queue?P.queue.length:0)*0.04, 0, 1.6);
    const v=activity*PDV_HEAT_RATE/(1+c*PDV_CHOUFFE_DAMP)-PDV_HEAT_DECAY;
    // borné à 0 : au-delà du seuil la marge est nulle, pas négative
    return v<=0.001 ? Infinity : Math.max(0,(PDV_SEUIL-S.heat)/v);
  };
  const a=sec(P.chouffes||0), b=sec((P.chouffes||0)+1);
  const fmt=(x)=>x===Infinity?"illimité":Math.round(x)+" s";
  return b===Infinity && a===Infinity ? "le coin ne chauffe plus" : `ouverture ${fmt(a)} → ${fmt(b)} avec un de plus`;

function pdvPatch(){

  const rc=document.getElementById("cResChip"); if(rc) rc.textContent=resChipTxt(P);

  const cc=document.getElementById("cComboChip"); if(cc) cc.textContent="⚡×"+(P.combo||1).toFixed(1).replace(".0","");

/* ---------- ARAH : l'évacuation, portée de le-spot ----------
   Le chouffe ne t'immunise pas, il te prévient. Pendant le préavis le monde
   s'arrête et tu rentres ce que tu peux : les barrettes retournent à la planque
   (« la planque est sauve », c'est déjà la règle de pdvDescente), la caisse passe
   en liquide. Ce qui reste dehors est saisi.

   CONSERVATION STRICTE (la leçon de le-spot, où j'avais introduit exactement ce
   bug) : on ne sort du tampon que des barrettes ENTIÈRES, et on les remet une par
   une dans les sachets. Retirer des grammes puis n'en réinjecter qu'une partie
   ferait de l'évacuation un geste qui CRÉE la perte qu'il prétend éviter — R1 à
   l'envers. */
let arahState=null;

   se voir dans la rue avant que l'écran d'évacuation prenne la main : sinon le joueur
   subit une modale sans jamais voir d'où vient l'alerte. La bulle part de la première
   silhouette présente (celle qu'on regarde), avec la vibration d'alarme. */
function arahCri(P){
  haptic(HAPTIC.cri);
  // Le cri appartient à la SCÈNE, pas à un client : c'est ton chouffe qui hurle, et
  // la descente tombe souvent quand la rue est vide. L'accrocher à `P.queue[0]`
  // rendait l'alerte muette précisément dans le cas le plus fréquent.
  const host=document.getElementById("cPersos")||document.getElementById("cScene");
  if(!host) return;
  const vieux=host.querySelector(".cbulle.cri"); if(vieux) vieux.remove();
  const b=document.createElement("div");
  b.className="cbulle cri";
  b.style.cssText="left:50%;bottom:58%;transform:translate(-50%,0)";
  b.textContent="ARAH !!";
  host.appendChild(b);
  setTimeout(()=>{ b.classList.add("out"); setTimeout(()=>b.remove(),200); }, 1500);
}
function arahOuvrir(preavis){
  const P=S.shelter.pdv;
  arahState={ left:preavis, total:preavis, cool:0, sauveG:0, cash:0, cri:0.9 };
  cause("ARAH","Chouffe : "+preavis+" s de préavis");
  arahCri(P);
  // le cri d'abord, l'écran ensuite. `cri` est un sas : tant qu'il tourne, la modale
  // reste fermée ET le préavis ne s'écoule pas — le temps que le chouffe t'achète
  // commence quand tu as compris, pas quand il ouvre la bouche.
}
function arahRentrer(){
  const P=S.shelter.pdv;
  if(!arahState || arahState.cool>0) return;
  // la boucle vit dans snap.mjs : le jeu l'appelle, les invariants l'importent
  const { n, g }=snap.evacuerLot(P.tampon, S.sachets, ARAH_LOT);
  if(!n) return;
  rentrerQ(P, g);                       // même symétrie de qualité que la sacoche
  arahState.sauveG+=g; arahState.cool=ARAH_COOL_MS/1000;
  // `save()` : les deux gestes de l'évacuation étaient les SEULES actions du jeu à
  // muter l'état sans le persister (39 autres appels le font). Le sauvetage ne
  // survivait donc pas à un onglet mis en arrière-plan pendant l'alerte — sur
  // téléphone, exactement le moment où ça arrive. Et c'est ce trou qui rendait le
  // test de ce geste instable : il lisait le localStorage que le code n'écrivait pas.
  save(); arahRender();
}
function arahCaisse(){
  const P=S.shelter.pdv;
  if(!arahState || arahState.cool>0 || !(P.bac>0)) return;
  arahState.cash+=P.bac; S.dirty+=P.bac; P.bac=0;
  arahState.cool=ARAH_COOL_MS/1000;

}
/* La STRUCTURE est construite une seule fois ; seul ce qui bouge est patché ensuite.
   Avant, `arahTick` rappelait ce rendu à CHAQUE frame et il réécrivait `innerHTML` :
   les deux boutons étaient donc détruits et recréés ~60 fois par seconde. Un `click`
   n'est émis que si le pointeur se relève sur le MÊME nœud que celui où il s'est posé
   — au doigt, il s'écoule ~100 ms entre les deux, donc le bouton pressé n'existait
   déjà plus. Le geste ne partait JAMAIS sur téléphone (un clic synthétique de test,
   lui, est instantané et passait : d'où un test au vert sur un écran mort).

   passait » — puis la descente a pris les 440 exposés. */
function arahRender(){
  const el=document.getElementById("arah"); if(!el) return;
  if(!arahState || arahState.cri>0){ el.classList.add("hide"); return; }
  el.classList.remove("hide");
  if(el.dataset.built!=="1"){
    el.innerHTML=`<div class="arah-box">
      <div class="arah-t">🚨 ARAH !! ARAH !!</div>
      <div class="arah-s">Ils arrivent. Rentre ce que tu peux — la planque est sûre.</div>
      <div class="arah-bar"><i id="arahBar"></i></div>
      <div class="arah-grid">
        <button class="arah-c" id="arahT"><div class="arah-i">📦</div><div>Rentrer les barrettes</div></button>
        <button class="arah-c" id="arahC"><div class="arah-i">💶</div><div>La caisse</div></button>
      </div>
      <div class="arah-f" id="arahF"></div>
    </div>`;
    el.dataset.built="1";
    document.getElementById("arahT").onclick=arahRentrer;
    document.getElementById("arahC").onclick=arahCaisse;

/* Ce qui change d'une frame à l'autre : la barre de préavis, le compte de ce qui est

function arahPatch(){
  if(!arahState) return;
  const P=S.shelter.pdv;
  const bar=document.getElementById("arahBar");
  if(bar) bar.style.width=Math.max(0,arahState.left/arahState.total*100)+"%";
  const t=document.getElementById("arahT"), c=document.getElementById("arahC");
  if(t) t.classList.toggle("cool", arahState.cool>0 || tampN(P.tampon)<=0);
  if(c) c.classList.toggle("cool", arahState.cool>0 || !(P.bac>0));
  const f=document.getElementById("arahF");
  if(f) f.innerHTML=`Encore dehors : <b>${tampN(P.tampon)} barrettes · ${Math.round(tampG(P.tampon))} g</b> · <b>${money(P.bac)}</b>`
    +(arahState.sauveG||arahState.cash?`<br><span style="color:#9be37d">rentré : ${Math.round(arahState.sauveG)} g · ${money(arahState.cash)}</span>`:"");

function arahTick(dt){

  if(arahState.cool>0) arahState.cool-=dt;

function pdvDescente(){
  const P=S.shelter.pdv, lost=Math.round(P.bac+tampG(P.tampon)*P.prix);
  P.bac=0; P.tampon={}; P.tamponQ=0; P.queue=[]; S.heat=PDV_AFTER; S.reput=clamp(S.reput-6,0,100);

  toast("🚨 Descente — barrettes + bac saisis (−"+lost+"). La planque est sauve.");

// livre nWant barrettes (sachets) de la planque vers le tampon exposé (petites d'abord)
/* ---------- La sacoche : tu composes ce que tu exposes ----------
   Le ravitaillement prenait « les plus petites d'abord » et vidait chaque taille
   avant la suivante : avec {2:30, 5:12} en planque, demander +25 donnait 25 barrettes
   de 2 g et AUCUNE de 5 g — et 5 g ne se compose pas avec des 2 g (2+2=4, 2+2+2=6),
   donc la demande de 5 g mourait. Mesuré à tampon et clientèle égaux :

     rue 2 g   → petites d'abord 25 clients / 50 g · au prorata 25 clients / 68 g
     rue 7,5 g → petites d'abord 10 clients / 50 g · mélangé   22 clients / 113 g

   Le défaut empire donc le long de l'axe de progression. Et surtout : AUCUNE
   stratégie automatique n'est bonne, parce que le bon mélange dépend de la demande —
   que le joueur pilote lui-même depuis qu'il annonce son calibre. La sacoche n'est
   pas un confort, c'est la seule réponse juste (R8). */
function sacocheRows(P){
  const fmts=[...new Set([...sizesOf(S.sachets), ...sizesOf(P.tampon)])].sort((a,b)=>a-b);
  const n=tampN(P.tampon), plein=n>=PDV_TAMPON_MAX;
  if(!fmts.length) return `<div class="muted" style="font-size:11px">Rien en planque — coupe et conditionne d'abord (Atelier).</div>`;
  // Ce que la sacoche SERT vraiment, et ce que la rue DEMANDE. Sans ces deux lignes,
  // « combien de 5 g » n'est pas une décision mais une devinette : c'est très
  // exactement le trou où Sylvain est tombé — découvrir qu'on ne peut pas servir 5 g
  // au moment où le client est devant soi. L'information existait déjà (`composables`),
  // elle n'était affichée que dans la carte de négo, trop tard.
  const sert=snap.composables(P.tampon, 20);
  const dem={}; for(let d=1;d<=20;d++) for(let s=0;s<10;s++){ const q=corner.anonQty(d,s,S.rue,S.rueMax); dem[q]=(dem[q]||0)+1; }
  const top=Object.keys(dem).map(Number).sort((a,b)=>dem[b]-dem[a]).slice(0,3);
  const manque=top.filter(q=>!sert.includes(q));
  return fmts.map(f=>{
    const dans=P.tampon[f]||0, reste=S.sachets[f]||0;
    return `<div class="stat"><span><b>${f} g</b> <span class="muted" style="font-size:10px">· planque ${reste}</span></span>
      <span style="display:flex;align-items:center;gap:6px">
        <button class="pb" data-sac="-1" data-f="${f}" ${dans<=0?"disabled":""}>−</button>
        <b style="min-width:22px;text-align:center">${dans}</b>
        <button class="pb" data-sac="1" data-f="${f}" ${reste<=0||plein?"disabled":""}>+</button>
        <button class="pb" data-sac="max" data-f="${f}" ${reste<=0||plein?"disabled":""} style="font-size:10px">tout</button>
      </span></div>`;
  }).join("")
  +`<div class="stat" style="border-top:1px solid var(--line);margin-top:4px;padding-top:6px">
      <span>Exposé <span class="muted" style="font-size:10px">· max ${PDV_TAMPON_MAX}</span></span>
      <b id="pTamp">${n} barrettes · ${Math.round(tampG(P.tampon))} g · Q${Math.round(n>0?P.tamponQ:(S.sachetQ||55))}</b></div>
    <div class="muted" style="font-size:10px;margin:2px 0 0">Sert : ${sert.length?sert.slice(0,10).map(q=>q+"").join(" · ")+(sert.length>10?" …":""):"<b style='color:var(--bad)'>rien</b>"}</div>
    <div class="muted" style="font-size:10px;margin:0 0 6px">La rue demande du <b>${corner.rueCalibre(S.rueMax)} g</b> — surtout ${top.map(q=>q+" g").join(" · ")}${manque.length?` · <b style="color:var(--bad)">tu ne sers pas ${manque.map(q=>q+" g").join(", ")}</b>`:""}</div>
    <div class="grid2"><button class="btn ghost" style="margin:0" data-sac="allin" ${n>=PDV_TAMPON_MAX?"disabled":""}>⤒ Charger la soirée</button>
      <button class="btn bad" style="margin:0" data-sac="allout" ${n<=0||arahState?"disabled":""}>⤓ Tout rentrer</button></div>
    ${arahState?`<div class="muted" style="font-size:10px;margin:4px 0 0;color:var(--bad)">Trop tard pour tout rentrer — c'est à la main, barrette par barrette.</div>`:""}`;
}
/* Les grammes en planque, avant mouvement — la qualité s'y moyenne comme partout
   ailleurs (même formule qu'au conditionnement, `commitSachet`). */
function planqueG(){ return Object.entries(S.sachets).reduce((a,[f,n])=>a+n*+f,0); }
/* SORTIR de la planque : la sacoche se moyenne avec ce qui arrive. */
function sortirQ(P, g){
  const qS=S.sachetQ||55, newG=tampG(P.tampon), oldG=newG-g;
  P.tamponQ = newG>0 ? avgMerge(oldG, P.tamponQ||qS, g, qS) : qS;
}
/* RENTRER en planque : la planque se moyenne avec ce qui revient. Sans cette ligne,
   un aller-retour CRÉAIT de la qualité — 260 g à q65,4 + 40 g à q50 rendaient q65,4
   au lieu de q63,3, cumulable à volonté. Les grammes étaient conservés, la qualité
   non : la symétrie de `deplacerBarrettes` doit valoir aussi pour ce qu'on y trimballe. */
function rentrerQ(P, g){
  if(g<=0) return;
  const avant=planqueG()-g;               // planqueG() inclut déjà ce qui vient de rentrer
  S.sachetQ=avgMerge(avant, S.sachetQ||55, g, P.tamponQ||S.sachetQ||55);
  if(tampN(P.tampon)<=0) P.tamponQ=0;     // sacoche vide : plus de qualité fantôme
}
/* Un mouvement de barrettes, dans un sens ou dans l'autre. */
function sacoche(f, delta){
  const P=S.shelter.pdv; if(!P.tampon) P.tampon={};
  if(delta>0){
    const place=PDV_TAMPON_MAX-tampN(P.tampon);
    if(place<=0){ toast("Sacoche pleine ("+PDV_TAMPON_MAX+" barrettes)."); return; }
    const r=snap.deplacerBarrettes(S.sachets, P.tampon, f, Math.min(delta, place));
    if(!r.n) return;
    sortirQ(P, r.g);
  } else {
    const r=snap.deplacerBarrettes(P.tampon, S.sachets, f, -delta);
    if(!r.n) return;
    rentrerQ(P, r.g);
  }
  cornerReniffle(P);
  save(); pdvSacPatch(P);
}
function sacocheTout(sens){
  const P=S.shelter.pdv;
  if(sens==="out"){
    let g=0; for(const f of sizesOf(P.tampon)) g+=snap.deplacerBarrettes(P.tampon, S.sachets, f, P.tampon[f]).g;
    rentrerQ(P, g); toast("Sacoche vidée — plus rien d'exposé.");
  }
  else {
    // « la soirée » remplit au PRORATA DE LA DEMANDE plutôt que par les petites d'abord :
    // un défaut par défaut sain, que le joueur peut ensuite corriger format par format.
    // Borné à SAC_LOT et non au plafond : mesuré, exposer 40 barrettes plutôt que 25
    // n'achète que ~4 points de servabilité et multiplie par 1,6 ce que la police peut
    // saisir. Le bouton ne doit pas pousser vers le mauvais côté de cet arbitrage —
    // le joueur monte plus haut au `+` s'il le veut, mais il le fait exprès.
    let place=Math.min(SAC_LOT, PDV_TAMPON_MAX-tampN(P.tampon));
    const fmts=sizesOf(S.sachets).sort((a,b)=>a-b);
    if(place<=0){ toast("Sacoche déjà chargée."); return; }
    if(!fmts.length){ toast("Rien en planque — coupe et conditionne d'abord."); return; }
    const dem={}; for(let d=1;d<=20;d++) for(let s=0;s<10;s++){ const q=corner.anonQty(d,s,S.rue,S.rueMax); dem[q]=(dem[q]||0)+1; }
    const tot=fmts.reduce((a,f)=>a+((dem[f]||0)+0.15),0);
    let g=0;
    for(const f of fmts){ if(place<=0) break;
      const veut=Math.min(S.sachets[f]||0, Math.round(place*((dem[f]||0)+0.15)/tot));
      const r=snap.deplacerBarrettes(S.sachets, P.tampon, f, veut); place-=r.n; g+=r.g; }
    // reliquat : on complète avec ce qui reste, en tournant. Cette boucle est
    // load-bearing — c'est elle qui sert les formats absents de `anonQty` (4, 6, 7, 9 g).
    while(place>0 && fmts.some(f=>(S.sachets[f]||0)>0)){
      let bouge=false;
      for(const f of fmts){ if(place<=0) break; const r=snap.deplacerBarrettes(S.sachets, P.tampon, f, 1); if(r.n){ place-=r.n; g+=r.g; bouge=true; } }
      if(!bouge) break;
    }
    // La sacoche pouvait déjà contenir un produit d'une AUTRE qualité : on moyenne, on
    // ne téléporte pas. Écrire `P.tamponQ = S.sachetQ` faisait passer 40 g de q30 à q90
    // en chargeant 10 g de q90 — +29 % de tolérance client en un tap.
    sortirQ(P, g);
    toast(tampN(P.tampon)+" barrettes en sacoche.");
  }
  cornerReniffle(P); save(); pdvSacPatch(P);
}
/* La file re-renifle : la qualité exposée vient de changer (R4).
   SAUF les clients déjà engagés. Un client en `nego`/`dernier` a annoncé un prix
   calculé avec l'ancien `qFac` ; le recalculer sous ses pieds fait que `resolveOffer`
   réévalue son propre dernier prix et renvoie `walk` — testé, 4 refus sur 4. Composer
   sa sacoche pendant qu'un client parle lui faisait refuser le prix qu'il venait de
   demander : une perte sèche déclenchée par une action neutre, R1 à l'envers. Le
   prédicat existe déjà pour la patience (`waiting`, plus haut) — même frontière. */
function cornerReniffle(P){
  const qN=Math.round(P.tamponQ||S.sachetQ||55), gf=corner.qualFac(qN);

const SKY_ANCHORS=[
  [0,   [7,9,20],    [12,15,32],   [20,26,46]],     // minuit — nuit noire
  [5,   [10,12,28],  [18,20,42],   [30,32,58]],      // nuit profonde (avant l'aube)
  [6.5, [40,44,80],  [96,82,112],  [216,138,116]],   // aube — horizon rosé/orangé (lever)
  [8,   [58,100,152],[120,152,188],[176,198,216]],  // matin clair

  [16,  [70,108,166],[140,150,180],[206,192,180]],  // après-midi (chaud léger)
  [18.5,[52,50,104], [112,70,100], [204,118,78]],    // crépuscule — horizon orangé
  [21,  [22,24,58],  [50,42,76],   [92,62,86]],      // tombée de nuit — violet
  [24,  [7,9,20],    [12,15,32],   [20,26,46]],      // minuit (boucle)
];
function cornerSky(h){
  h=((h%24)+24)%24; let a=SKY_ANCHORS[0],b=SKY_ANCHORS[SKY_ANCHORS.length-1];
  for(let i=0;i<SKY_ANCHORS.length-1;i++){ if(h>=SKY_ANCHORS[i][0]&&h<=SKY_ANCHORS[i+1][0]){ a=SKY_ANCHORS[i]; b=SKY_ANCHORS[i+1]; break; } }
  const f=(h-a[0])/((b[0]-a[0])||1), L=(x,y)=>Math.round(x+(y-x)*f);
  const rgb=i=>`rgb(${L(a[i][0],b[i][0])},${L(a[i][1],b[i][1])},${L(a[i][2],b[i][2])})`;
  return `linear-gradient(180deg, ${rgb(1)} 0%, ${rgb(2)} 44%, ${rgb(3)} 66%, ${rgb(3)} 100%)`;
}
function cornerNight(h){ h=((h%24)+24)%24; // 1 = nuit (lampadaire/fenêtres allumés), 0 = plein jour

   format. Couper du 8 g ne suffit pas à ce que la rue en demande ; il faut le dire.
   Et parce que c'est un geste explicite, il est SYMÉTRIQUE : on ré-annonce le petit

function snapFormatsDispo(){
  const fmts=new Set([corner.RUE_MIN]);
  for(const f of Object.keys(S.bars||{})) if(S.bars[f]>0) fmts.add(corner.rueCalibre(+f));
  for(const f of Object.keys(S.sachets||{})) if(S.sachets[f]>0) fmts.add(corner.rueCalibre(+f));
  fmts.add(corner.rueCalibre(S.rueMax||corner.RUE_MIN));
  return [...fmts].sort((a,b)=>a-b);
}
function snapFormatCard(){
  const dispo=snapFormatsDispo(), actuel=corner.rueCalibre(S.rueMax||corner.RUE_MIN);
  const neuf=S.annonce&&S.annonce.calibre>actuel ? S.annonce.calibre : 0;
  return `<div class="card">

    <div class="muted" style="font-size:10px;margin-top:6px">Annoncé : <b>${actuel} g</b> · ${Math.round(100*corner.ruePartGros(S.rue||corner.RUE_MIN))} % de gros paniers au corner.</div>

function annoncerFormat(f){
  const avant=corner.rueCalibre(S.rueMax||corner.RUE_MIN);
  if(f===avant){ toast("C'est déjà ton format annoncé."); return; }
  S.rueMax=f;
  if(f<avant) S.rue=Math.min(S.rue||corner.RUE_MIN, f); // descente : la rue suit tout de suite (R1, réversible)
  if(S.annonce&&S.annonce.calibre===f) S.annonce=null;
  cause("Format annoncé", `${avant} g → ${f} g sur SnapShit`);
  toast(f>avant?`📣 Le quartier sait que tu sors du ${f} g.`:`📣 Retour au ${f} g annoncé.`);
  save(); renderSnap();

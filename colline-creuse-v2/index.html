function ligne(parent, { nom, desc, tags, btn, onBtn, dis, off, ico }) {
  const r = document.createElement("div");
  r.className = "row" + (off ? " off" : "");
  if (ico) { const i = document.createElement("div"); i.className = "ricon"; i.appendChild(icon(ico, 22)); r.appendChild(i); }
  const t = document.createElement("div"); t.className = "rtxt";
  const n = document.createElement("div"); n.className = "rn"; n.textContent = nom;
  if (tags) for (const tg of tags) {
    const s = document.createElement("span");
    s.className = "tag " + (tg.k || ""); s.textContent = tg.t; s.style.marginLeft = "6px";
    n.appendChild(s);
  }
  t.appendChild(n);
  if (desc) { const d = document.createElement("div"); d.className = "rd"; d.innerHTML = desc; t.appendChild(d); }
  r.appendChild(t);
  if (btn) {
    const b = document.createElement("button");
    b.className = "btn sm" + (dis ? "" : " pri"); b.textContent = btn; b.disabled = !!dis;
    b.onclick = onBtn; r.appendChild(b);
  }
  parent.appendChild(r);
  return r;
}
const titre = (p, t) => { const d = document.createElement("div"); d.className = "rn";
  d.style.marginTop = "11px"; d.textContent = t; p.appendChild(d); return d; };
const aide = (p, html) => { const d = document.createElement("div"); d.className = "hint";
  d.innerHTML = html; p.appendChild(d); return d; };

// --- un espace creusé ------------------------------------------------------
function panneauSalle(e) {
  const f = FONC(e.key);
  tabOuvert = "salle";
  const couv = couvertureExc(e);
  ouvrirSheet(f.nom, aire(e) + " cellules · " + Math.round(couv) + " de roche au-dessus");
  sheetBody.textContent = "";

  if (e.t > 0) { aide(sheetBody, "Chantier en cours — encore <b>" + Math.ceil(e.t) + " s</b>."); return; }

  aide(sheetBody, f.desc + "<br><b>" + f.effet + "</b> · exposition <b>×" + fmt(EXPO(couv)) + "</b>" +
    (e.key === "forage" ? (surNappe(e) ? " · <b style='color:var(--green)'>sur la nappe</b>" : " · pas sur la nappe") : ""));

  if (e.key === "galerie") {
    titre(sheetBody, "Aménager");
    aide(sheetBody, "Cet espace fait <b>" + aire(e) + " cellules</b>. La taille décide de la capacité : " +
      "un poste par tranche de 4 cellules.");
    for (const k of Object.keys(FONCTIONS)) {
      const g = FONCTIONS[k];
      if (g.libre) continue;
      const petit = aire(e) < g.minC;
      const hautain = g.couvMin && couv < g.couvMin;
      const cher = S.res.matos < g.cout;
      let d = g.desc + "<br><b>" + g.effet + "</b>";
      if (petit) d += "<br><span class='no'>Il faut " + g.minC + " cellules (il y en a " + aire(e) + ").</span>";
      if (hautain) d += "<br><span class='no'>Il faut " + g.couvMin + " de roche au-dessus.</span>";
      const tags = [{ t: g.sig >= 4 ? "bruyante" : g.sig >= 1.5 ? "discrète" : "muette",
                      k: g.sig >= 4 ? "sig" : "good" }];
      if (g.postesMax) tags.push({ t: clamp(Math.floor(aire(e) / 4), 1, g.postesMax) + " poste(s) ici" });
      ligne(sheetBody, { nom: g.nom, desc: d, tags, ico: "matos",
        btn: g.cout + " matos", dis: petit || hautain || cher, off: petit || hautain || cher,
        onBtn: () => amenager(e, k) });
    }
  } else {
    const pm = postesMax(e);
    if (pm) {
      titre(sheetBody, "Postes " + occupants(e.id).length + "/" + pm);
      aide(sheetBody, "Un colon dont c'est le métier produit à 100 %, un autre à 65 %.");
      for (const c of S.colons) {
        if (c.dehors) continue;
        const ici = c.room === e.id;
        const bon = TALENTS[c.talent].salles.includes(e.key);
        ligne(sheetBody, {
          nom: c.nom, ico: "colon",
          tags: [{ t: TALENTS[c.talent].nom, k: bon ? "good" : "" }],
          desc: "moral " + Math.round(c.moral) + " %" +
            (ici ? " · en poste ici" : c.room ? " · " + FONC(excById(c.room)?.key).nom : " · sans affectation"),
          btn: ici ? "retirer" : "affecter", dis: !ici && occupants(e.id).length >= pm,
          onBtn: () => { affecter(c.id, ici ? null : e.id); panneauSalle(e); },
        });
      }
    }
    if (f.prodPoste || f.conso) {
      titre(sheetBody, "Régime");
      const seg = document.createElement("div"); seg.className = "seg";
      REGIMES.forEach((rg, i) => {
        const b = document.createElement("button");
        b.textContent = rg.nom;
        if (e.reg === i) b.classList.add("on");
        b.onclick = () => { e.reg = i; dirty = true; majTout(); panneauSalle(e); sfx("tap"); };
        seg.appendChild(b);
      });
      sheetBody.appendChild(seg);
      aide(sheetBody, REGIMES[e.reg].d + "<br>signature à ce régime : <b>" +
        fmt(f.sig * EXPO(couv) * REGIMES[e.reg].sig * (e.marquee ? 1.6 : 1) * (e.panne ? 1.7 : 1)) + "</b>");
    }
    if (e.panne) {
      const b = document.createElement("button");
      b.className = "btn wide ok"; b.textContent = "Réparer (14 matos)";
      b.disabled = S.res.matos < 14;
      b.onclick = () => { S.res.matos -= 14; e.panne = false; toast("Réparé.", "good");
        sfx("done"); dirty = true; majTout(); panneauSalle(e); };
      sheetBody.appendChild(b);
    }
  }

  const b = document.createElement("button");
  b.className = "btn wide bad";
  b.textContent = "Reboucher";
  b.onclick = () => reboucher(e);
  sheetBody.appendChild(b);
  if (e.marquee) aide(sheetBody, "<b style='color:var(--red)'>Repérée d'en haut.</b> " +
    "Ils savent où elle est : 60 % plus visible, définitivement. La reboucher est le seul moyen de l'effacer.");
}

  const cav = cavitesLibres();

    ligne(sheetBody, { nom: m.nom, desc: d, tags, btn: "y aller", dis, off: dis,

      nom: o.nom,
      tags: [{ t: o.equipe + " colon" + (o.equipe > 1 ? "s" : "") },
             { t: o.sig > 0 ? "+" + o.sig + " signature" : "discret", k: o.sig > 6 ? "sig" : "" },
             { t: Math.round(o.risque * 100) + " % de casse", k: o.risque > .1 ? "sig" : "" }],
      desc: o.d + "<br>rapporte <b>" + o.gain + "</b> en " + o.sec + " s",
      btn: enCours ? Math.ceil(enCours.reste) + " s" : "envoyer",
      dis: !!enCours || S.ops.length >= S.opsSlots || librables().length <= o.equipe, off: !!enCours,
      onBtn: () => lancerOp(k),
    });
  }

  titre(sheetBody, "Le cahier");
  const jl = S.jalons.map((k) => JALONS.find((j) => j.cle === k));
  aide(sheetBody, (jl.length ? "<b>Jalons :</b> " + jl.map((j) => j.t).join(" · ") + "<br><br>" : "") +
    S.log.slice(0, 16).map((x) => "· " + x).join("<br>"));
}

/* =====================================================================
   12. CARTES D'ÉVÈNEMENT
   ===================================================================== */

const modal = document.getElementById("modal");
const cardEl = document.getElementById("card");
let modalOuverte = false;
let vitesseAvant = 1;

function carte(kicker, titre, texte, options) {
  modalOuverte = true;
  vitesseAvant = S.speed || 1;
  S.speed = 0; majVitesse();
  cardEl.textContent = "";
  const k = document.createElement("div"); k.className = "kicker"; k.textContent = kicker;
  const h = document.createElement("h2"); h.textContent = titre;
  const p = document.createElement("p"); p.textContent = texte;
  const o = document.createElement("div"); o.className = "opts";
  cardEl.append(k, h, p, o);
  for (const opt of options) {
    const b = document.createElement("button"); b.className = "opt";
    const dis = opt.ok && !opt.ok();
    b.disabled = !!dis;
    const n1 = document.createElement("div"); n1.className = "o1"; n1.textContent = opt.n;
    const n2 = document.createElement("div"); n2.className = "o2"; n2.textContent = opt.d || "";
    b.append(n1, n2);
    b.onclick = () => { sfx("tap"); const f = opt.f; fermerCarte(); if (f) f(); dirty = true; majTout(); };
    o.appendChild(b);
  }
  modal.classList.add("show");
}

function fermerCarte() {
  modal.classList.remove("show");
  modalOuverte = false;
  if (!S.gameover) { S.speed = vitesseAvant || 1; majVitesse(); }
}

/* =====================================================================
   13. INTERACTIONS — dont le creusement au doigt
   ===================================================================== */

const DOCK = [
  { tab: "creuser", ico: "creuser", nom: "Creuser" },
  { tab: "colons", ico: "colon", nom: "Colons" },
  { tab: "dehors", ico: "dehors", nom: "Dehors" },
  { tab: "silence", ico: "silence", nom: "Silence" },
];

let modeCreuse = false;
const digbar = document.getElementById("digbar");

function construireDock() {
  const d = document.getElementById("dock");
  d.textContent = "";
  for (const b of DOCK) {
    const btn = document.createElement("button");
    btn.dataset.tab = b.tab;
    btn.appendChild(icon(b.ico, 20));
    const s = document.createElement("span"); s.textContent = b.nom;
    btn.appendChild(s);
    btn.onclick = () => {
      ac();
      if (b.tab === "silence") { basculerSilence(); return; }
      if (b.tab === "creuser") { basculerCreuse(); return; }
      if (tabOuvert === b.tab) { fermerSheet(); return; }
      for (const x of d.querySelectorAll("button")) if (x.dataset.tab !== "creuser") x.classList.remove("on");
      btn.classList.add("on");
      if (b.tab === "colons") panneauColons();
      if (b.tab === "dehors") panneauDehors();
      sfx("tap");
    };
    d.appendChild(btn);
  }
}

function basculerCreuse() {
  modeCreuse = !modeCreuse;
  fermerSheet();
  stage.classList.toggle("creuse", modeCreuse);
  digbar.classList.toggle("show", modeCreuse);
  if (modeCreuse) majDigbar(null);
  sfx("tap");
  majHud();
}

// --- coordonnées écran -> cellule ------------------------------------------
function cellDe(ev) {
  const r = scene.getBoundingClientRect();
  const k = W / r.width;
  const ux = (ev.clientX - r.left) * k, uy = (ev.clientY - r.top) * k;
  return [Math.floor(ux / CELL), Math.floor(uy / CELL)];
}

let drag = null;

function majDigbar(a, rect) {
  if (!a) {
    digbar.innerHTML = "<div class='dt'>Trace une salle au doigt dans la terre.<br>" +
      "<span class='ds'>Elle doit toucher ce qui est déjà creusé. " + BAL.portee + " cellules de large au maximum.</span></div>" +
      "<button class='btn sm' id='digend'>Terminé</button>";
    document.getElementById("digend").onclick = () => basculerCreuse();
    return;
  }
  const co = COUCHE(TERRE[key(rect.c, rect.r)] || 0);
  digbar.innerHTML = "<div class='dt'>" +
    (a.ok
      ? "<b>" + rect.w + "×" + rect.h + "</b> dans " + co.nom.toLowerCase() +
        " · <b>" + a.matos + "</b> matos · <b>" + a.sec + " s</b> · <b>" + a.deblais + " m³</b> à sortir" +
        "<br><span class='ds'>" + Math.round(a.couv) + " de roche au-dessus → exposition ×" + fmt(EXPO(a.couv)) +
        (a.nappe ? " · <b>de l'eau</b>" : "") + (a.filon ? " · <b>de la ferraille</b>" : "") + "</span>"
      : "<span class='no'>" + a.raison + "</span>") +
    "</div>";
}

function apercuRect(rect, ok) {
  const g = document.getElementById("apercu");
  if (!g) return;
  g.textContent = "";
  if (!rect) return;
  const x = rect.c * CELL, y = rect.r * CELL, w = rect.w * CELL, h = rect.h * CELL;
  el("rect", { x, y, width: w, height: h,
    fill: ok ? "rgba(51,64,154,.16)" : "rgba(180,69,60,.18)" }, g);
  penRect(g, x, y, w, h, { seed: 4242, w: 2, amp: 1.6, col: ok ? "#33409a" : "#b4453c" });
}

scene.addEventListener("pointerdown", (ev) => {
  ac();
  if (!modeCreuse) return;
  const [c, r] = cellDe(ev);
  if (!dansGrille(c, r)) return;
  drag = { c0: c, r0: r, c, r };
  scene.setPointerCapture(ev.pointerId);
  majDrag();
  ev.preventDefault();
});

scene.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const [c, r] = cellDe(ev);
  drag.c = clamp(c, 0, GW - 1); drag.r = clamp(r, 0, GH - 1);
  majDrag();
  // pour atteindre le fond sans sortir du mode : la coupe suit le doigt
  const b = stage.getBoundingClientRect();
  if (ev.clientY > b.bottom - 70) stage.scrollTop += 7;
  else if (ev.clientY < b.top + 70) stage.scrollTop -= 7;
  ev.preventDefault();
});

function rectDrag() {
  const c = Math.min(drag.c0, drag.c), r = Math.min(drag.r0, drag.r);
  return { c, r, w: Math.abs(drag.c - drag.c0) + 1, h: Math.abs(drag.r - drag.r0) + 1 };
}
function majDrag() {
  const rc = rectDrag();
  const a = apercuCreuse(rc.c, rc.r, rc.w, rc.h);
  apercuRect(rc, a.ok);
  majDigbar(a, rc);
}

scene.addEventListener("pointerup", (ev) => {
  if (!drag) return;
  const rc = rectDrag();
  drag = null;
  apercuRect(null);
  const fait = creuser(rc.c, rc.r, rc.w, rc.h);
  majDigbar(null);
  if (fait) { _creuse = null; _ouvert = null; _revele = null; }
  ev.preventDefault();
});
scene.addEventListener("pointercancel", () => { drag = null; apercuRect(null); majDigbar(null); });

scene.addEventListener("click", (ev) => {
  if (modeCreuse) return;
  ac();
  const room = ev.target.closest(".room");
  if (room) { const e = excById(+room.dataset.id); if (e) { panneauSalle(e); sfx("tap"); } }
});

document.getElementById("sheetclose").onclick = fermerSheet;
document.getElementById("heatbar").onclick = () => {
  ac();
  if (tabOuvert === "soupcon") { fermerSheet(); return; }
  for (const x of document.querySelectorAll("#dock button")) if (x.dataset.tab !== "creuser") x.classList.remove("on");
  panneauSoupcon(); sfx("tap");
};

for (const b of document.querySelectorAll("#speed button")) {
  b.onclick = () => { ac(); S.speed = +b.dataset.sp; majVitesse(); };
}
function majVitesse() {
  for (const b of document.querySelectorAll("#speed button")) b.classList.toggle("on", +b.dataset.sp === S.speed);
}

function toast(txt, kind) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = txt;
  const box = document.getElementById("toasts");
  box.appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .4s"; t.style.opacity = "0"; }, 2600);
  setTimeout(() => t.remove(), 3100);
  while (box.children.length > 3) box.firstChild.remove();
}

function majTout() {
  if (dirty) { const y = stage.scrollTop; _creuse = null; _ouvert = null; _revele = null;
    renderScene(); stage.scrollTop = y; }
  majHud();
}

/* =====================================================================
   14. BOUCLE
   ===================================================================== */

let last = performance.now(), acc = 0, saveCd = 0, hudCd = 0;
function boucle(now) {
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!modalOuverte && S.speed > 0 && !S.gameover) {
    acc += real * S.speed;
    while (acc >= 0.1) { step(0.1); acc -= 0.1; }
    saveCd -= real;
    if (saveCd <= 0) { sauver(); saveCd = 5; }
  }
  animerColons(real);                 // les bonshommes, eux, bougent à chaque image
  hudCd -= real;
  if (dirty || hudCd <= 0) { majTout(); hudCd = 0.14; }
  requestAnimationFrame(boucle);
}

/* =====================================================================
   15. DÉMARRAGE
   ===================================================================== */

S = charger() || nouvellePartie();
construireHud();
construireDock();
majVitesse();
renderScene();
majHud();

// on cadre sur l'entrée : c'est là que tout commence
if (S.exc[0]) {
  requestAnimationFrame(() => {
    const k = stage.clientWidth / W;
    stage.scrollTop = Math.max(0, (S.exc[0].r * CELL - 205) * k);
  });
}

document.addEventListener("visibilitychange", () => { if (document.hidden) sauver(); });
window.addEventListener("pagehide", sauver);

if (S.t === 0 && !S.log.length) {
  const t = TAILLES.find((x) => x.cle === S.village.taille);
  journal("On ouvre la colline au-dessus de " + S.village.nom + ".");
  carte("Sous la colline", "Personne ne sait que vous êtes là",
    "Trois personnes, un puits, et " + S.village.nom + " en bas — un " + t.nom + " de " +
    S.village.pop + " habitants.\n\n" +
    "Ici, rien n'est prévu : vous tracez vos salles au doigt, où vous voulez, dans la roche que " +
    "vous trouverez. Plus vous descendez, moins on vous entend — mais plus c'est long et cher, " +
    "et toute la terre que vous sortez finit en tas derrière la grange.\n\n" +
    "Il n'y a pas de partie à gagner. Il y a une colline, et ce que vous en ferez.",
    [{ n: "Prendre la pioche", d: "Touche « Creuser », puis trace un rectangle au doigt.", f: () => {} }]);
}

if (location.search.includes("debug")) {
  window.CC = {
    etat: () => S, reset: recommencer, step, creuser, amenager, affecter, lancerOp, lancerEvac,
    poserFacade, acheter, basculerSilence, ajouterColon, reboucher,
    signature, signatureDetail, tolerance, bilanEnergie, bilanAir, prodNette, placesLits,
    capacites, excById, occupants, postesEff, postesMax, couvertureExc, apercuCreuse, aire,
    EXPO, creuse: () => creuse(), surNappe, cavitesLibres, paliers, majJalons,
    FONCTIONS, BAL, OPS, TALENTS, TRAITS, TAILLES, COUCHES, EVACUATIONS, FACADE_ORDRE, JALONS,
    GW, GH, CELL, SOL: () => SOL, TERRE: () => TERRE, ACC: () => ACC,
    repondreCarte: () => {
      const b = [...document.querySelectorAll("#card .opt")].find((x) => !x.disabled);
      if (b) { b.click(); return true; }
      return false;
    },
    modaleOuverte: () => modalOuverte,
  };
}

requestAnimationFrame(boucle);
</script>
</body>
</html>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#243b36"><title>Du grain à la plaquette · The Capital</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="world" aria-label="Atelier de production en première personne"></canvas>
<header><div class="brand"><small>AU FOUR, MON AMOUR · ATELIER 01</small><h1 data-t="title">Du grain à la plaquette</h1></div><div class="toptools"><button id="sound" aria-label="Son">♫</button><button id="settings" aria-label="Réglages">☷</button><button id="language">EN</button><a href="documentation.html" aria-label="Guide">?</a></div></header>
<aside class="challenge"><span data-t="challenge">LE TOUR DE MAIN</span><strong><b id="made">0</b><i>/ 10</i></strong><small data-t="challengeHint">Dix plaquettes pour trouver le rythme.</small></aside>
<div class="reticle" aria-hidden="true">·</div>
<div id="toast" role="status" aria-live="polite"></div>
<button id="view" class="view" data-t="view">↔ Vue d’ensemble</button>
<main class="console">
<nav class="stations" aria-label="Postes"><button class="active" data-station="drum"><em>01</em><span data-t="drum">Le tambour</span></button><button data-station="press"><em>02</em><span data-t="press">La presse</span></button><button data-station="packing"><em>03</em><span data-t="packing">Le paquet</span></button></nav>
<section id="drum-panel" class="station-panel"><div class="instruction"><small data-t="drumKicker">UN PEU D’ÉLAN</small><h2 data-t="drumTitle">Laissez travailler l’inertie.</h2><p id="drum-status"></p></div><div class="actions"><label class="field"><span data-t="source">Bac de récolte</span><select id="source"></select></label><button id="load" class="primary" data-t="load">Verser le bac · glisser ↑</button><button id="impulse" class="accent" data-t="impulse">Impulsion · Espace</button><button id="take-jars" data-t="takeJars">Maintenir pour prendre les pots</button><button id="stock" data-t="stock">Choisir les pots →</button></div></section>
<section id="press-panel" class="station-panel" hidden><div class="instruction"><small id="press-meta"></small><h2 id="press-state"></h2><p id="press-status"></p></div><div class="actions"><button id="press-stock" data-t="stock">Choisir les pots →</button><button id="tray" data-t="tray">Prendre le bac · E</button><button id="pour" class="primary" data-t="pour">Verser · maintenir et glisser ↑</button><button id="compress" class="accent" data-t="compress">Presser · maintenir Espace</button><button id="drawer" data-t="drawer">Moule 100 g ↔ 250 g</button><button id="recover" data-t="recover">Pots & récupération</button></div></section>
<section id="packing-panel" class="station-panel" hidden><div class="instruction"><small data-t="packingKicker">LA SÉRIE PREND FORME</small><h2 id="packing-state"></h2><p data-t="packingHint">Même variété et format. Chaque récolte garde sa trace.</p></div><div class="actions"><button id="take-plates" class="primary" data-t="takePlates">Maintenir pour ramasser</button><button id="selection" data-t="selection">Corriger la sélection</button><button id="radial" class="accent" data-t="tools">Outils · R</button><button id="drop" data-t="drop">Poser le paquet</button><button id="open" data-t="open">Ouvrir un paquet posé</button><button id="trace" data-t="trace">Voir les contenus</button></div></section>
<footer><span id="integrity"></span><span class="pc-hint" data-t="controls">Souris glissée : regarder · ZQSD / WASD : marcher</span></footer>
</main>
<dialog id="modal"><div class="modal-top"><h2 id="modal-title"></h2><button id="close" aria-label="Fermer">×</button></div><div id="modal-body"></div></dialog>
<div id="tool-wheel" hidden><button id="wrap"><span>◉</span><b data-t="wrap">Rouleau</b></button><button id="knife"><span>╱</span><b data-t="knife">Couteau</b></button><button id="cancel-tools" data-t="cancel">Fermer</button></div>
<script type="module" src="app.mjs"></script></body></html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>La Colline Creuse — colonie souterraine</title>
<style>
  /* ------------------------------------------------------------------
     LA COLLINE CREUSE — colonie souterraine cachée sous une colline.
     Tout est dessiné au stylo bille : les traits sont générés en SVG avec
     un bruit seedé (même partie = même tremblement de main). Zéro asset,
     zéro dépendance, zéro requête réseau.
     ------------------------------------------------------------------ */
  :root {
    --paper:#efeadd;
    --ink:#33409a;                      /* bille bleue */
    --ink-soft:rgba(51,64,154,.55);
    --ink-faint:rgba(51,64,154,.26);
    --red:#b4453c;                      /* bille rouge : alertes */
    --green:#3f7a4a;
    --hand: "Bradley Hand","Noteworthy","Chalkboard SE","Marker Felt","Segoe Print",
            "Ink Free","Comic Sans MS",-apple-system,"Segoe UI",Roboto,sans-serif;
    --sans: -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:var(--hand); font-size:15px; line-height:1.35;
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

  /* grain de papier : une tuile de bruit répétée par-dessus toute l'interface */
  body::after {
    content:""; position:fixed; inset:0; z-index:20; pointer-events:none;
    mix-blend-mode:multiply; opacity:.45;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='140' height='140' filter='url(%23n)' opacity='0.26'/></svg>");
    background-size:140px 140px;
  }

  #app {
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px; display:flex; flex-direction:column; z-index:1;
  }

  /* ---------------- bandeau du haut ---------------- */
  #hud { flex:none; padding:max(6px, env(safe-area-inset-top)) 10px 5px; }
  #hudtop { display:flex; align-items:baseline; gap:7px; padding:0 2px 3px; }
  #title { font-size:15px; font-weight:700; letter-spacing:.2px; }
  #daylbl { font-size:12px; color:var(--ink-soft); }
  #cashlbl { font-family:var(--sans); font-size:12px; font-weight:700; }
  #speed { margin-left:auto; display:flex; gap:4px; }
  #speed button {
    font-family:var(--sans); font-size:11px; font-weight:800; padding:2px 8px;
    border:1.5px solid var(--ink-faint); border-radius:9px; color:var(--ink-soft);
  }
  #speed button.on { color:var(--paper); background:var(--ink); border-color:var(--ink); }

  .gauges { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; }
  .g { padding:2px 2px 3px; border-radius:8px; text-align:center; }
  .g svg { display:block; height:16px; margin:0 auto; }
  .g .gv { font-family:var(--sans); font-size:12.5px; font-weight:800; letter-spacing:-.3px; }
  .g .gd { font-family:var(--sans); font-size:9px; color:var(--ink-soft); }
  .g.warn { background:rgba(180,69,60,.1); }
  .g.warn .gv, .g.warn .gd { color:var(--red); }
  .g.hide { display:none; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .g.pop .gv { display:inline-block; animation:pop .3s ease-out; }

  #heatwrap { margin-top:4px; padding:0 2px; }
  #heatbar {
    cursor:pointer; position:relative; height:14px; border:1.5px solid var(--ink-faint);
    border-radius:7px; overflow:hidden; background:rgba(255,255,255,.4);
  }
  #heatfill {
    position:absolute; inset:0 auto 0 0; width:0%;
    background:repeating-linear-gradient(115deg, var(--ink-soft) 0 3px, transparent 3px 6px);
    transition:width .35s linear;
  }
  #heatfill.hot { background:repeating-linear-gradient(115deg, rgba(180,69,60,.8) 0 3px, transparent 3px 6px); }
  #heatlbl {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--sans); font-size:9.5px; font-weight:800; letter-spacing:.4px;
  }
  #heatarrow { position:absolute; right:5px; top:0; bottom:0; display:flex; align-items:center;
    font-family:var(--sans); font-size:9px; font-weight:800; }

  /* ---------------- la coupe ---------------- */
  #stage { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative; }
  #scene { display:block; width:100%; height:auto; }
  #scene text { font-family:var(--hand); fill:var(--ink); }
  #scene .rlbl { font-size:13px; font-weight:700; }
  #scene .rsub { font-size:9.5px; font-family:var(--sans); fill:var(--ink-soft); }
  #scene .rbig { font-size:11px; font-family:var(--sans); font-weight:700; }
  #scene .room, #scene .slot { cursor:pointer; }
  #scene .slot text { fill:var(--ink-soft); }

  /* ---------------- barre du bas ---------------- */
  #dock {
    flex:none; display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    padding:5px 10px max(6px, env(safe-area-inset-bottom));
  }
  #dock button {
    position:relative; display:flex; flex-direction:column; align-items:center; gap:0;
    padding:4px 2px 2px; border-radius:11px;
  }
  #dock button svg { height:20px; }
  #dock button span { font-family:var(--sans); font-size:9.5px; font-weight:700; letter-spacing:.1px; }
  #dock button.on { background:rgba(51,64,154,.12); }
  #dock button.alarm { background:rgba(180,69,60,.16); }
  #dock .badge {
    position:absolute; top:0; right:14px;
    font-family:var(--sans); font-size:9px; font-weight:800; color:var(--paper);
    background:var(--red); border-radius:8px; padding:0 4px; min-width:14px; text-align:center;
  }

  /* ---------------- bandeau d'alerte (survol) ---------------- */
  #alert {
    position:fixed; left:50%; transform:translateX(-50%) translateY(24px);
    bottom:calc(58px + env(safe-area-inset-bottom)); z-index:7;
    width:100%; max-width:410px; padding:0 10px;
    opacity:0; visibility:hidden; transition:transform .25s ease-out, opacity .2s;
  }
  #alert.show { transform:translateX(-50%) translateY(0); opacity:1; visibility:visible; }
  #alertin {
    background:var(--red); color:var(--paper); border-radius:12px; padding:8px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 4px 14px rgba(120,40,35,.3);
  }
  #alertin .at { flex:1; font-family:var(--sans); font-size:12px; font-weight:700; line-height:1.25; }
  #alertin .ac { font-family:var(--sans); font-size:19px; font-weight:800; font-variant-numeric:tabular-nums; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
  #alertin.urgent { animation:shake .35s infinite; }

  /* ---------------- panneau coulissant ---------------- */
  #sheet {
    position:fixed; left:50%; transform:translateX(-50%) translateY(101%); bottom:0; z-index:9;
    width:100%; max-width:430px; max-height:82%; display:flex; flex-direction:column;
    background:var(--paper); border-top:2.5px solid var(--ink);
    border-radius:16px 16px 0 0; box-shadow:0 -8px 24px rgba(40,40,60,.18);
    transition:transform .24s cubic-bezier(.3,.8,.4,1);
    padding-bottom:max(10px, env(safe-area-inset-bottom));
  }
  #sheet.show { transform:translateX(-50%) translateY(0); }
  #sheethead { display:flex; align-items:baseline; gap:8px; padding:11px 14px 5px; flex:none; }
  #sheettitle { font-size:17px; font-weight:700; }
  #sheetsub { font-family:var(--sans); font-size:11px; color:var(--ink-soft); }
  #sheetclose { margin-left:auto; font-size:19px; line-height:1; padding:0 6px; color:var(--ink-soft); }
  #sheetbody { overflow-y:auto; padding:0 14px 12px; }

  .row { display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1.5px dotted var(--ink-faint); }
  .row:last-child { border-bottom:none; }
  .row .rtxt { flex:1; min-width:0; }
  .row .rn { font-size:15px; font-weight:700; }
  .row .rd { font-family:var(--sans); font-size:11px; color:var(--ink-soft); line-height:1.3; }
  .row .rd b { color:var(--ink); font-weight:700; }
  .row .rd .no { color:var(--red); font-weight:700; }
  .row.off { opacity:.45; }
  .row .ricon { flex:none; width:26px; text-align:center; }

  .btn { font-family:var(--sans); font-size:12px; font-weight:700; white-space:nowrap;
    padding:7px 11px; border:2px solid var(--ink); border-radius:11px; }
  .btn:active { transform:translateY(1px); }
  .btn.pri { background:var(--ink); color:var(--paper); }
  .btn.bad { border-color:var(--red); color:var(--red); }
  .btn.ok { border-color:var(--green); color:var(--green); }
  .btn[disabled] { opacity:.32; }
  .btn.sm { padding:4px 8px; font-size:11px; border-width:1.5px; }
  .btn.wide { width:100%; text-align:center; margin-top:8px; }

  .hint { font-family:var(--sans); font-size:11.5px; color:var(--ink-soft); padding:7px 0 2px; line-height:1.4; }
  .hint b { color:var(--ink); }
  .seg { display:flex; gap:5px; padding:6px 0 2px; flex-wrap:wrap; }
  .seg button { font-family:var(--sans); font-size:11px; font-weight:700; padding:4px 9px;
    border:1.5px solid var(--ink-faint); border-radius:9px; color:var(--ink-soft); }
  .seg button.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tag { display:inline-block; white-space:nowrap; font-family:var(--sans); font-size:9.5px;
    font-weight:800; letter-spacing:.3px; padding:1px 6px; border-radius:7px;
    border:1.5px solid var(--ink-faint); color:var(--ink-soft); vertical-align:2px; }
  .tag.sig { border-color:rgba(180,69,60,.5); color:var(--red); }
  .tag.good { border-color:rgba(63,122,74,.5); color:var(--green); }

  /* ---------------- carte d'évènement ---------------- */
  #modal { position:fixed; inset:0; z-index:12; display:none; align-items:center;
    justify-content:center; padding:16px; background:rgba(60,58,50,.4); }
  #modal.show { display:flex; }
  #card {
    width:100%; max-width:400px; max-height:88%; overflow-y:auto;
    background:var(--paper); border:2.5px solid var(--ink); border-radius:5px;
    padding:15px 15px 13px; box-shadow:4px 5px 0 rgba(51,64,154,.16);
  }
  #card .kicker { font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:1.3px;
    text-transform:uppercase; color:var(--red); margin-bottom:3px; }
  #card h2 { font-size:19px; margin-bottom:5px; line-height:1.15; }
  #card p { font-size:14.5px; line-height:1.45; margin-bottom:11px; }
  #card .opts { display:flex; flex-direction:column; gap:7px; }
  #card .opt { display:block; width:100%; text-align:left; padding:9px 11px;
    border:2px solid var(--ink); border-radius:10px; }
  #card .opt:active { background:rgba(51,64,154,.08); }
  #card .opt .o1 { font-size:14.5px; font-weight:700; }
  #card .opt .o2 { font-family:var(--sans); font-size:11px; color:var(--ink-soft); margin-top:1px; line-height:1.3; }
  #card .opt[disabled] { opacity:.4; }

  /* ---------------- toasts ---------------- */
  #toasts { position:fixed; left:0; right:0; bottom:calc(112px + env(safe-area-inset-bottom));
    z-index:11; display:flex; flex-direction:column; align-items:center; gap:4px;
    pointer-events:none; padding:0 14px; }
  .toast { font-family:var(--sans); font-size:12px; font-weight:700; text-align:center;
    background:var(--ink); color:var(--paper); padding:6px 12px; border-radius:13px;
    box-shadow:0 3px 10px rgba(40,40,60,.22); animation:tin .22s ease-out; max-width:100%; }
  .toast.bad { background:var(--red); }
  .toast.good { background:var(--green); }
  @keyframes tin { from { opacity:0; transform:translateY(8px); } }

  /* silence radio : la colline s'éteint */
  #blackout { position:fixed; inset:0; z-index:4; pointer-events:none; opacity:0;
    background:radial-gradient(115% 85% at 50% 34%, rgba(22,24,44,0) 0%, rgba(22,24,44,.5) 100%);
    transition:opacity .6s; }
  #blackout.on { opacity:1; }
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div id="hudtop">
      <div id="title">La Colline Creuse</div>
      <div id="daylbl">jour 1</div>
      <div id="cashlbl"></div>
      <div id="speed">
        <button data-sp="0" aria-label="pause">II</button>
        <button data-sp="1" class="on">▶</button>
        <button data-sp="3">▶▶</button>
      </div>
    </div>
    <div class="gauges" id="gauges"></div>
    <div id="heatwrap">
      <div id="heatbar">
        <div id="heatfill"></div>
        <div id="heatlbl">DEHORS, ON NE SAIT RIEN</div>
        <div id="heatarrow"></div>
      </div>
    </div>
  </header>

  <div id="stage"><svg id="scene" xmlns="http://www.w3.org/2000/svg"></svg></div>

  <nav id="dock"></nav>
</div>

<div id="blackout"></div>
<div id="alert"><div id="alertin"><div class="at"></div><div class="ac"></div></div></div>
<div id="toasts"></div>

<div id="sheet">
  <div id="sheethead">
    <div id="sheettitle"></div><div id="sheetsub"></div>
    <button id="sheetclose">✕</button>
  </div>
  <div id="sheetbody"></div>
</div>

<div id="modal"><div id="card"></div></div>

<script type="module">
"use strict";

/* =====================================================================
   0. OUTILS — hasard seedé, tracé "stylo bille"
   ===================================================================== */

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = (seed) => mulberry32(seed);
const rnd = Math.random;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = (arr) => arr[(rnd() * arr.length) | 0];
const fmt = (v) => (Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10);
const sign = (v) => (v > 0 ? "+" : "") + fmt(v);

// Points bruités le long d'un segment : le tremblement du poignet.
function wobble(x1, y1, x2, y2, r, amp = 1.1, step = 20) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
  const n = Math.max(2, Math.round(len / step));
  const nx = -dy / len, ny = dx / len, pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = (i === 0 || i === n) ? amp * .2 : amp;
    const o = (r() * 2 - 1) * a;
    pts.push([x1 + dx * t + nx * o, y1 + dy * t + ny * o]);
  }
  return pts;
}

function toPath(pts, close) {
  if (pts.length < 2) return "";
  const f = (v) => Math.round(v * 10) / 10;
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x, y] = pts[i], [x2, y2] = pts[i + 1];
    d += `Q${f(x)} ${f(y)} ${f((x + x2) / 2)} ${f((y + y2) / 2)}`;
  }
  const l = pts[pts.length - 1];
  d += `L${f(l[0])} ${f(l[1])}`;
  return close ? d + "Z" : d;
}

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function penLine(g, x1, y1, x2, y2, o = {}) {
  const r = R(o.seed || 1), w = o.w ?? 1.6, col = o.col || "#33409a", amp = o.amp ?? 1;
  el("path", { d: toPath(wobble(x1, y1, x2, y2, r, amp, o.step || 20)), fill: "none",
    stroke: col, "stroke-width": w, "stroke-linecap": "round", opacity: o.op ?? .92 }, g);
  if (o.double !== false) {
    el("path", { d: toPath(wobble(x1, y1, x2, y2, r, amp * .8, o.step || 20)), fill: "none",
      stroke: col, "stroke-width": w * .7, "stroke-linecap": "round", opacity: (o.op ?? .92) * .45 }, g);
  }
}

function penRect(g, x, y, w, h, o = {}) {
  const s = o.seed || 1, ov = o.over ?? 1.5;
  penLine(g, x - ov, y, x + w + ov, y, { ...o, seed: s + 1 });
  penLine(g, x + w, y - ov, x + w, y + h + ov, { ...o, seed: s + 2 });
  penLine(g, x + w + ov, y + h, x - ov, y + h, { ...o, seed: s + 3 });
  penLine(g, x, y + h + ov, x, y - ov, { ...o, seed: s + 4 });
}

function penCircle(g, cx, cy, rad, o = {}) {
  const r = R(o.seed || 7), pts = [], n = Math.max(10, Math.round(rad * 1.6)), amp = o.amp ?? .8;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2 + (o.rot || 0);
    const rr = rad + (r() * 2 - 1) * amp;
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  pts.push(pts[1]);
  el("path", { d: toPath(pts), fill: o.fill || "none", stroke: o.col || "#33409a",
    "stroke-width": o.w ?? 1.6, "stroke-linecap": "round", opacity: o.op ?? .92 }, g);
}

function penHatch(g, x, y, w, h, o = {}) {
  const gap = o.gap || 9, slope = o.slope ?? .55, col = o.col || "rgba(51,64,154,.26)";
  for (let i = -h; i < w; i += gap) {
    const x1 = x + i, y1 = y + h, x2 = x + i + h * slope, y2 = y;
    const cx1 = Math.max(x, Math.min(x + w, x1)), cx2 = Math.max(x, Math.min(x + w, x2));
    if (cx2 - cx1 < 1.5) continue;
    const t1 = (cx1 - x1) / ((x2 - x1) || 1), t2 = (cx2 - x1) / ((x2 - x1) || 1);
    penLine(g, cx1, y1 + (y2 - y1) * t1, cx2, y1 + (y2 - y1) * t2,
      { seed: (o.seed || 11) + i * 7, w: o.w ?? .9, amp: .6, col, op: o.op ?? .5, double: false, step: 26 });
  }
}

// Bonhomme bâton. Les membres sont dessinés en TROIS poses superposées
// (pas gauche / pas droit / repos) : la marche se joue en changeant laquelle
// est visible, sans jamais redessiner un trait.
function membres(parent, s, col, w, seed, ph) {
  const arm = Math.sin(ph) * 3.4 * s, leg = Math.sin(ph) * 4.4 * s;
  penLine(parent, 0, -12.5 * s, -6.4 * s, -6.5 * s + arm, { seed: seed + 2, w, amp: .5, col, step: 14 });
  penLine(parent, 0, -12.5 * s, 6.4 * s, -6.5 * s - arm, { seed: seed + 3, w, amp: .5, col, step: 14 });
  penLine(parent, 0, -4 * s, -4.6 * s + leg, 6 * s, { seed: seed + 4, w, amp: .5, col, step: 14 });
  penLine(parent, 0, -4 * s, 4.6 * s - leg, 6 * s, { seed: seed + 5, w, amp: .5, col, step: 14 });
}

function stickman(g, o = {}) {
  const s = o.s || 1, col = o.col || "#33409a", w = (o.w ?? 1.7) * s, seed = o.seed || 1;
  const gg = el("g", {}, g);
  penCircle(gg, 0, -20 * s, 4.6 * s, { seed, w, amp: .55, col });
  penLine(gg, 0, -15.4 * s, 0, -4 * s, { seed: seed + 1, w, amp: .5, col, step: 14 });
  if (o.statique) { membres(gg, s, col, w, seed, o.phase || 0); return gg; }
  const poses = [];
  for (const ph of [1.15, -1.15, 0]) {
    const p = el("g", {}, gg);
    membres(p, s, col, w, seed + (ph > 0 ? 0 : ph < 0 ? 40 : 80), ph);
    poses.push(p);
  }
  gg._poses = poses;
  poses[0].style.display = "none"; poses[1].style.display = "none";
  return gg;
}

/* Petits pictos dessinés au stylo (aucune police d'icônes). */
function icon(kind, size = 22) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("width", size); s.setAttribute("height", size);
  const g = el("g", {}, s), o = { w: 1.6, amp: .5, step: 16 };
  if (kind === "energie") {
    penLine(g, 14, 3, 7, 13, { ...o, seed: 2 }); penLine(g, 7, 13, 12.5, 13, { ...o, seed: 3 });
    penLine(g, 12.5, 13, 9, 21, { ...o, seed: 4 }); penLine(g, 9, 21, 17, 10, { ...o, seed: 5 });
    penLine(g, 17, 10, 11.5, 10, { ...o, seed: 6 }); penLine(g, 11.5, 10, 14, 3, { ...o, seed: 7 });
  } else if (kind === "air") {
    for (let i = 0; i < 3; i++) {
      const y = 7 + i * 5;
      penLine(g, 3, y, 15, y - 1.5, { ...o, seed: 10 + i, amp: 1.1, step: 7 });
      penCircle(g, 17.5, y - 2.2, 2.6, { seed: 20 + i, w: 1.4, amp: .4 });
    }
  } else if (kind === "eau") {

    for (let i = 0; i < pts.length - 1; i++) {

      d += (i ? "" : "M" + seg[0][0].toFixed(1) + " " + seg[0][1].toFixed(1)) +
           seg.slice(1).map((p) => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
    }
    el("path", { d, fill: "none", stroke: "#33409a", "stroke-width": 1.6, "stroke-linejoin": "round" }, g);
  } else if (kind === "vivres") {
    penCircle(g, 12, 14, 6.5, { seed: 41, w: 1.6, amp: .5 });

  } else if (kind === "colon") {
    const gg = el("g", { transform: "translate(12 20) scale(.9)" }, g);

  } else if (kind === "creuser") {

    penLine(g, 21, 11, 14, 12.5, { ...o, seed: 74, w: 1.5 });
  } else if (kind === "dehors") {

    penLine(g, 12, 3.5, 12, 20.5, { ...o, seed: 83, w: 1.2, op: .6, double: false });
    penCircle(g, 12, 12, 4.4, { seed: 84, w: 1.2, amp: .4, op: .6 });
  } else if (kind === "silence") {
    penCircle(g, 12, 12, 8.5, { seed: 91, w: 1.7, amp: .5 });
    penLine(g, 6, 6, 18, 18, { ...o, seed: 92, w: 2 });

}

const W = 390;
const SURF = 250;
const TOP0 = SURF + 58;
const LVL_H = 86, LVL_GAP = 11;
const SHAFT_X = 168, SHAFT_W = 54;
const SLOT_W = 150, LEFT_X = 12, RIGHT_X = SHAFT_X + SHAFT_W + 6;
const MAX_LVL = 8;

const levelTop = (i) => TOP0 + i * (LVL_H + LVL_GAP);
const EXPO = (l) => BAL.expo[Math.min(l, BAL.expo.length - 1)];
const slotX = (side) => (side === 0 ? LEFT_X : RIGHT_X);

const HILL = [[-8, SURF + 26], [58, SURF + 12], [116, SURF - 16], [166, SURF - 44],
              [214, SURF - 50], [268, SURF - 34], [330, SURF - 16], [W + 8, SURF - 4]];

function hillY(x) {
  for (let i = 0; i < HILL.length - 1; i++) {
    const [x1, y1] = HILL[i], [x2, y2] = HILL[i + 1];
    if (x <= x2) { const t = clamp((x - x1) / (x2 - x1), 0, 1); return y1 + (y2 - y1) * t; }
  }
  return HILL[HILL.length - 1][1];
}

const roomDef = (r) => ROOMS[r.key];
const roomById = (id) => S.rooms.find((r) => r.id === id);
const occupants = (id) => S.colons.filter((c) => c.room === id && !c.dehors);
const librables = () => S.colons.filter((c) => !c.dehors);

function placesLits() {
  return 3 + S.rooms.filter((r) => r.key === "dortoir" && !r.chantier).length * 5;
}

function capacites() {
  const n = S.rooms.filter((r) => r.key === "reserve" && !r.chantier).length;
  return { vivres: BAL.capBase.vivres + n * 70, eau: BAL.capBase.eau + n * 70,
           matos: BAL.capBase.matos + n * 60 };
}

// Rendement d'une salle : 0 si éteinte/chantier, sinon f(postes occupés, talent, moral).
function rendement(r) {
  const d = roomDef(r);
  if (r.chantier > 0 || !r.reg || S.silence > 0 || r.coupee) return 0;
  const panne = (r.panne ? 0.5 : 1) * REGIMES[r.reg].prod;
  if (!d.postes) return panne;
  const occ = occupants(r.id);
  if (!occ.length) return 0;
  let q = 0;
  for (const c of occ.slice(0, d.postes)) {
    const bon = TALENTS[c.talent].salles.includes(r.key);
    q += (bon ? 1 : 0.65) * (0.55 + 0.45 * (c.moral / 100));
  }
  return (q / d.postes) * panne;
}

// L'ordre dans lequel le courant est servi quand il en manque : ce qui tient
// la colonie en vie d'abord, le confort en dernier. Le reste est DÉLESTÉ —
// c'est ce qui évite la spirale (on coupe l'atelier, pas la pompe).
const ORDRE_CIRCUIT = ["puits", "ventil", "serre", "sas", "dortoir", "commune",
                       "atelier", "ecoute", "pc", "reserve"];

// Répartit le courant produit : marque r.coupee sur ce qui n'est pas alimenté.
function majCircuit() {
  let prod = 0;
  for (const r of S.rooms) {
    const d = roomDef(r);
    if (d.prod?.energie) { r.coupee = false; prod += d.prod.energie * rendement(r); }
  }
  const dem0 = S.rooms.filter((r) => roomDef(r).conso?.energie);
  const ordre = dem0.slice().sort((a, b) =>
    ORDRE_CIRCUIT.indexOf(a.key) - ORDRE_CIRCUIT.indexOf(b.key));
  // Le courant descend dans l'ordre et s'arrête là où il n'y en a plus :
  // tout ce qui est en dessous tombe. C'est brutal, mais c'est lisible — et
  // le joueur choisit l'ordre en éteignant lui-même ce dont il se passe.
  let reste = prod, dem = 0, coupees = 0, apanne = false;
  for (const r of ordre) {
    const c = roomDef(r).conso.energie;
    const eteinte = r.chantier > 0 || !r.reg || S.silence > 0;
    if (eteinte) { r.coupee = false; continue; }
    dem += c;
    if (!apanne && reste >= c) { reste -= c; r.coupee = false; }
    else { apanne = true; r.coupee = true; coupees++; }
  }
  return { prod, dem, servi: prod - reste, coupees };
}

function bilanEnergie() {
  const b = majCircuit();
  return { ...b, taux: b.dem > 0 ? clamp(b.servi / b.dem, 0, 1) : 1 };
}

function bilanAir() {
  let prod = BAL.airTrappe;          // tirage naturel par le puits (passif, gratuit)
  for (const r of S.rooms) {
    const d = roomDef(r);
    if (d.prod?.air) prod += d.prod.air * rendement(r);
  }
  const profMoy = S.rooms.length ? S.rooms.reduce((a, r) => a + r.lvl, 0) / S.rooms.length : 0;
  const dem = librables().length * (BAL.airParColon + BAL.airParNiveau * profMoy);
  return { prod, dem, taux: dem > 0 ? clamp(prod / dem, 0, 1) : 1 };
}

// Ce que la colline laisse voir, par minute.
// Ce que la colline laisse voir, poste par poste. `detail` sert au panneau
// qui explique au joueur POURQUOI il s'est fait repérer.
function signatureDetail() {
  const lignes = [];
  const guet = S.rooms.some((r) => r.key === "sas" && occupants(r.id).length > 0 && !r.chantier);
  for (const r of S.rooms) {
    const d = roomDef(r);
    if (r.chantier > 0) {
      lignes.push({ t: "Chantier : " + d.nom, v: BAL.sigChantier * EXPO(r.lvl), n: "le bruit des travaux" });
      continue;
    }
    if (!r.reg || S.silence > 0 || r.coupee) continue;
    let v = d.sig * EXPO(r.lvl) * REGIMES[r.reg].sig;
    if (d.prod || d.conso) v *= (0.35 + 0.65 * rendement(r) / (REGIMES[r.reg].prod || 1));
    const notes = ["rangée " + (r.lvl + 1) + " ×" + EXPO(r.lvl)];
    if (r.reg !== 2) notes.push(REGIMES[r.reg].court);
    if (r.panne) { v *= 1.7; notes.push("en panne"); }
    if (r.marquee) { v *= 1.6; notes.push("repérée"); }
    if (v > 0.05) lignes.push({ t: d.nom, v, n: notes.join(" · ") });
  }
  const nc = librables().length;
  if (nc) lignes.push({ t: nc + " personnes", v: nc * BAL.sigParColon, n: "des allées et venues" });
  for (const o of S.ops) lignes.push({ t: OPS[o.key].nom, v: OPS[o.key].sig, n: "équipe dehors" });
  let total = lignes.reduce((a, x) => a + x.v, 0);
  if (guet) { const g = -total * 0.35; lignes.push({ t: "Guetteur au sas", v: g, n: "il efface les traces" }); total += g; }
  lignes.sort((a, b) => b.v - a.v);
  return { total: Math.max(0, total), lignes };
}

// Version chiffrée seule, sans allocation : c'est elle qui tourne à chaque image.
function signature() {
  let sig = 0;
  const guet = S.rooms.some((r) => r.key === "sas" && !r.chantier && occupants(r.id).length > 0);
  for (const r of S.rooms) {
    const d = roomDef(r);
    if (r.chantier > 0) { sig += BAL.sigChantier * EXPO(r.lvl); continue; }
    if (!r.reg || S.silence > 0 || r.coupee) continue;
    let v = d.sig * EXPO(r.lvl) * REGIMES[r.reg].sig;
    if (d.prod || d.conso) v *= (0.35 + 0.65 * rendement(r) / (REGIMES[r.reg].prod || 1));
    if (r.panne) v *= 1.7;
    if (r.marquee) v *= 1.6;
    sig += v;
  }
  sig += librables().length * BAL.sigParColon;
  for (const o of S.ops) sig += OPS[o.key].sig;
  if (guet) sig *= 0.65;
  return Math.max(0, sig);
}

function tolerance() { return BAL.toleranceBase + FACADES[S.facade].tol; }

function paliers() {
  const s = S.soupcon;
  if (s < 25) return { lbl: "DEHORS, ON NE SAIT RIEN", n: 0 };
  if (s < 50) return { lbl: "UNE RUMEUR AU VILLAGE", n: 1 };
  if (s < 72) return { lbl: "ON REGARDE LA COLLINE", n: 2 };
  if (s < 90) return { lbl: "ILS SAVENT QU'IL Y A QUELQUE CHOSE", n: 3 };
  return { lbl: "ILS ARRIVENT", n: 4 };
}

function autonome() {
  const e = bilanEnergie(), a = bilanAir();
  const vp = prodNette("vivres"), ep = prodNette("eau");
  return e.prod >= e.dem && a.prod >= a.dem && vp >= 0 && ep >= 0
    && librables().length >= BAL.objColons;
}

function prodNette(res) {
  let p = 0;
  for (const r of S.rooms) {
    const d = roomDef(r);
    if (d.prod?.[res]) p += d.prod[res] * rendement(r);
    if (d.conso?.[res] && !r.chantier && r.reg && S.silence <= 0 && !r.coupee) p -= d.conso[res];
  }
  const n = librables().length;
  if (res === "vivres") p -= n * BAL.vivresParColon;
  if (res === "eau") p -= n * BAL.eauParColon;
  return p;
}

/* =====================================================================
   5. SIMULATION
   ===================================================================== */

function step(dt) {                     // dt en secondes de jeu
  if (S.gameover) return;
  S.t += dt;
  const jour = 1 + Math.floor(S.t / BAL.jourSec);
  if (jour !== S.jour) { S.jour = jour; onNouveauJour(); }

  // chantiers
  for (const r of S.rooms) {
    if (r.chantier > 0) {
      r.chantier -= dt;
      if (r.chantier <= 0) { r.chantier = 0; toast(roomDef(r).nom + " : chantier terminé", "good"); sfx("done"); dirty = true; }
    }
  }

  // silence radio
  if (S.silence > 0) {
    S.silence -= dt;
    if (S.silence <= 0) { S.silence = 0; document.getElementById("blackout").classList.remove("on"); toast("On rallume."); dirty = true; }
  }

  // le courant se répartit avant tout le reste
  const be = bilanEnergie();

  // stocks
  const cap = capacites();
  const n = librables().length;
  for (const res of ["eau", "vivres", "matos"]) {
    let p = 0;
    for (const r of S.rooms) {
      const d = roomDef(r);
      if (d.prod?.[res]) p += d.prod[res] * rendement(r);
      if (d.conso?.[res] && !r.chantier && r.reg && S.silence <= 0 && !r.coupee) p -= d.conso[res];
    }
    if (res === "vivres") p -= n * BAL.vivresParColon;
    if (res === "eau") p -= n * BAL.eauParColon;
    S.res[res] = clamp(S.res[res] + (p * dt) / 60, 0, cap[res]);
  }

  // façade : rentrée d'argent et entretien
  const f = FACADES[S.facade];
  S.res.cash = Math.max(0, S.res.cash + ((f.cash - f.upkeep) * dt) / 60);

  // air
  const ba = bilanAir();
  S.res.air = ba.prod; S.res.energie = be.prod;

  // moral
  const commune = S.rooms.some((r) => r.key === "commune" && !r.chantier && r.reg);
  const lits = placesLits();
  for (const c of S.colons) {
    if (c.dehors) continue;
    let dm = BAL.moralRepos;
    if (S.res.vivres <= 0) dm += BAL.moralFaim;
    if (S.res.eau <= 0) dm += BAL.moralSoif;
    if (ba.taux < 0.85) dm += BAL.moralAsphyxie * (1 - ba.taux);
    if (S.silence > 0) dm += BAL.moralNoir;
    if (commune) dm += 2.2;
    if (librables().length > lits) dm -= 3;
    const sr = c.room ? roomById(c.room) : null;
    if (sr && sr.reg === 3) dm += REGIMES[3].moral;
    c.moral = clamp(c.moral + (dm * dt) / 60, 0, 100);
  }
  // un colon à bout s'en va — mais pas d'un coup : on a le temps de réagir
  for (const c of S.colons) {
    if (c.dehors) continue;
    if (c.moral <= 1) {
      const avant = c.bout || 0;
      c.bout = avant + dt;
      if (avant < 1 && c.bout >= 1) { toast(c.nom + " parle de remonter.", "bad"); journal(c.nom + " est à bout."); }
    } else if (c.moral > 12) c.bout = 0;
  }
  for (const c of [...S.colons]) {
    if (!c.dehors && (c.bout || 0) >= 25) {
      S.colons = S.colons.filter((x) => x.id !== c.id);
      toast(c.nom + " a repris le chemin. Il parlera.", "bad");
      S.soupcon = clamp(S.soupcon + 9, 0, 100);
      journal(c.nom + " est parti (moral à zéro).");
      dirty = true;
    }
  }

  // coups de pouce : on dit UNE fois la chose que le joueur ne peut pas deviner
  if (!S.vus.sortie && S.res.matos < 12 && !S.ops.length && S.t > 45) {
    S.vus.sortie = true;
    toast("Plus de matos. Rien ne tombe du ciel : il faut sortir en chercher (Dehors).", "bad");
  }
  if (!S.vus.air && S.depth >= 3) S.vus.air = true;

  // secret
  const sig = signature(), tol = tolerance();
  if (sig > tol) S.soupcon += (sig - tol) * BAL.soupconMontee * dt;
  else S.soupcon -= BAL.soupconOubli * dt * (1 + (tol - sig) / 20);
  S.soupcon = clamp(S.soupcon, 0, 100);
  if (S.soupcon >= 100) return finPartie("descente");
  if (!S.colons.length) return finPartie("vide");

  // opérations en cours
  for (const o of [...S.ops]) {
    o.reste -= dt;
    if (o.reste <= 0) resoudreOp(o);
  }

  // alerte en cours (survol) : il faut avoir coupé
  if (S.alerte) {
    S.alerte.reste -= dt;
    if (S.alerte.reste <= 0) resoudreAlerte();
  }

  // évènements
  S.evtCd -= dt;
  if (S.evtCd <= 0 && !S.alerte && !modalOuverte) tirerEvenement();

  // objectif
  if (!S.victoire) {
    if (autonome()) { S.autonomieT += dt; if (S.autonomieT >= BAL.objTenirSec) victoire(); }
    else S.autonomieT = Math.max(0, S.autonomieT - dt * 2);
  }
}

function onNouveauJour() {
  journal("— jour " + S.jour + " —");
  if (S.jour === 2 && !S.vus.ecoute) toast("Le monde extérieur continue de tourner.");
}

function finPartie(cause) {
  S.gameover = cause;
  S.speed = 0;
  majVitesse();
  const txt = cause === "descente"
    ? { k: "C'est fini", t: "Ils ont trouvé la trappe",
        p: "Deux fourgons au petit matin, un chien, une disqueuse. " + librables().length +
           " personnes sont sorties les mains sur la tête. La colline redevient une colline." }
    : { k: "C'est fini", t: "Il n'y a plus personne",
        p: "La dernière lampe s'éteint toute seule au fond du puits. Personne ne saura jamais qu'il y avait quelqu'un ici." };
  carte(txt.k, txt.t, txt.p, [{ n: "Recommencer", d: "Une autre colline, un autre trou.", f: recommencer }]);
  sfx("bad");
}

function victoire() {
  S.victoire = true;
  journal("Autonomie atteinte.");
  carte("Objectif", "La colline se suffit à elle-même",
    "Douze personnes, de l'eau, de l'air, de la lumière, et rien qui dépasse. Dehors, on parle encore d'un rucher. " +
    "Vous pouvez continuer à creuser — mais vous n'avez plus besoin de personne.",
    [{ n: "Continuer à creuser", d: "Mode libre.", f: fermerCarte }]);
  sfx("win");
}

function recommencer() {
  localStorage.removeItem(SAVE_KEY);
  S = nouvellePartie();
  fermerCarte(); fermerSheet();
  dirty = true; majTout();
}

/* =====================================================================
   6. ACTIONS
   ===================================================================== */

function peutPayer(cout) { return S.res.matos >= cout; }

function creuser(lvl, side, key) {
  const d = ROOMS[key];
  const total = d.cout + BAL.coutNiveau(lvl);
  if (!peutPayer(total)) { toast("Pas assez de matos.", "bad"); return; }
  if (d.unique && S.rooms.some((r) => r.key === key)) { toast("Il n'en faut qu'une.", "bad"); return; }
  if (d.need && !S.rooms.some((r) => r.key === d.need && !r.chantier)) {
    toast("Il faut d'abord : " + ROOMS[d.need].nom, "bad"); return;
  }
  if (d.minLvl && lvl < d.minLvl) { toast("Trop près de la surface pour ça.", "bad"); return; }
  S.res.matos -= total;
  S.rooms.push({ id: S.nextRoom++, key, lvl, side, reg: 2, chantier: BAL.chantierSec(lvl) });
  if (lvl + 1 > S.depth) S.depth = Math.min(MAX_LVL, lvl + 1);
  if (lvl >= 2) S.vus.air = true;
  journal("Chantier ouvert : " + d.nom + " (niveau " + (lvl + 1) + ")");
  toast("On creuse. Ça s'entend.", "");
  sfx("dig");
  fermerSheet(); dirty = true; majTout();
}

function affecter(colonId, roomId) {
  const c = S.colons.find((x) => x.id === colonId);
  if (!c || c.dehors) return;
  const r = roomId ? roomById(roomId) : null;
  if (r) {
    const d = roomDef(r);
    if (d.postes && occupants(r.id).length >= d.postes && c.room !== r.id) {
      toast("Plus de poste libre ici.", "bad"); return;
    }
  }
  c.room = roomId || null;
  c.x = 0.2 + rnd() * 0.6;
  dirty = true; majTout(); sfx("tap");
}

function basculerSilence(sec) {
  if (S.silence > 0) { S.silence = 0; document.getElementById("blackout").classList.remove("on"); toast("On rallume."); }
  else {
    S.silence = sec || 22;
    document.getElementById("blackout").classList.add("on");
    toast("Silence radio. Tout s'éteint.", "");
    sfx("off");
    if (S.alerte) { S.alerte.coupe = true; }
  }
  dirty = true; majTout();
}

function lancerOp(key) {
  const o = OPS[key];
  if (S.ops.length >= S.opsSlots) { toast("Pas d'équipe disponible.", "bad"); return; }
  const dispo = S.colons.filter((c) => !c.dehors);
  if (dispo.length - o.equipe < 1) { toast("Il faut laisser quelqu'un ici.", "bad"); return; }
  const equipe = dispo.sort((a, b) => b.moral - a.moral).slice(0, o.equipe);
  for (const c of equipe) { c.dehors = true; c.room = null; }
  S.ops.push({ key, reste: o.sec, equipe: equipe.map((c) => c.id), x: 0 });
  journal("Sortie : " + o.nom + " (" + equipe.map((c) => c.nom).join(", ") + ")");
  toast("Ils sortent par la trappe.");
  fermerSheet(); dirty = true; majTout(); sfx("tap");
}

function resoudreOp(o) {
  S.ops = S.ops.filter((x) => x !== o);
  const d = OPS[o.key];
  const equipe = o.equipe.map((id) => S.colons.find((c) => c.id === id)).filter(Boolean);
  for (const c of equipe) { c.dehors = false; c.moral = clamp(c.moral - 6, 0, 100); }
  const rate = rnd() < d.risque * (1 + S.soupcon / 140);
  if (rate) {
    const perdu = equipe[0];
    if (perdu) {
      S.colons = S.colons.filter((c) => c.id !== perdu.id);
      S.soupcon = clamp(S.soupcon + 14, 0, 100);
      toast(perdu.nom + " ne rentre pas. Ils l'ont eu.", "bad");
      journal(perdu.nom + " est tombé pendant : " + d.nom);
      sfx("bad");
    }
  } else {
    const cap = capacites();
    if (o.key === "ferraille") {
      const g = 35 + Math.floor(rnd() * 21);
      S.res.matos = Math.min(cap.matos, S.res.matos + g);
      toast("Retour : +" + g + " matos", "good");
    } else if (o.key === "vivres") {
      const g = 45 + Math.floor(rnd() * 26);
      S.res.vivres = Math.min(cap.vivres, S.res.vivres + g);
      toast("Retour : +" + g + " vivres", "good");
    } else if (o.key === "recrue") {
      ajouterColon();
    } else if (o.key === "brouiller") {
      S.soupcon = clamp(S.soupcon - 18, 0, 100);
      toast("Les pistes sont brouillées.", "good");
    }
    sfx("good");
  }
  dirty = true; majTout();
}

function ajouterColon(nom) {
  if (librables().length >= placesLits()) {
    toast("Pas de lit libre : il faut un dortoir.", "bad");
    return null;
  }
  const utilises = S.colons.map((c) => c.nom);
  const dispo = PRENOMS.filter((p) => !utilises.includes(p));
  const c = {
    id: S.nextColon++, nom: nom || (dispo.length ? pick(dispo) : "N°" + S.nextColon),
    talent: pick(TALENT_KEYS), room: null, moral: 62, x: .5, dir: 1,
  };
  S.colons.push(c);
  toast(c.nom + " descend. " + TALENTS[c.talent].nom + ".", "good");
  journal(c.nom + " a rejoint la colline (" + TALENTS[c.talent].nom + ").");
  dirty = true;
  return c;
}

function poserFacade(key) {
  const f = FACADES[key];
  if (S.res.matos < f.cout) { toast("Pas assez de matos.", "bad"); return; }
  S.res.matos -= f.cout;
  S.facade = key;
  journal("Façade : " + f.nom);
  toast("Dehors, on raconte : " + f.nom.toLowerCase() + ".", "good");
  fermerSheet(); dirty = true; majTout(); sfx("good");
}

function acheter(quoi) {
  const prix = { vivres: 14, eau: 10, matos: 20 }[quoi];
  const qte = { vivres: 30, eau: 30, matos: 25 }[quoi];
  if (S.facade === "aucune") { toast("Sans façade, on ne peut rien acheter au village.", "bad"); return; }
  if (S.res.cash < prix) { toast("Pas assez de liquide.", "bad"); return; }
  const cap = capacites();
  S.res.cash -= prix;
  S.res[quoi] = Math.min(cap[quoi], S.res[quoi] + qte);
  S.soupcon = clamp(S.soupcon + 1.5, 0, 100);
  toast("+" + qte + " " + quoi + " (livré au bas du chemin)", "good");
  dirty = true; majTout(); sfx("tap");
}

function tirerEvenement() {
  const p = paliers().n;
  const dispo = EVENTS.filter((e) => (!e.cond || e.cond()) && e.poids(p) > 0);
  const total = dispo.reduce((a, e) => a + e.poids(p), 0);
  let x = rnd() * total;
  for (const e of dispo) { x -= e.poids(p); if (x <= 0) { e.run(); break; } }
  S.evtCd = 30 + rnd() * 26 - p * 3;
  dirty = true; majTout();
}

function resoudreAlerte() {
  const a = S.alerte; S.alerte = null;
  document.getElementById("alert").classList.remove("show");
  if (S.silence > 0 || a.coupe) {
    S.soupcon = clamp(S.soupcon - 9, 0, 100);
    toast("Le bruit s'éloigne. Ils n'ont rien vu.", "good");
    journal("Survol : rien à voir, tout était éteint.");
    sfx("good");
  } else {
    const vu = 8 + signature() * 0.6;
    S.soupcon = clamp(S.soupcon + vu, 0, 100);
    // il a vu quelque chose de précis : la salle la plus voyante est marquée
    const candidates = S.rooms.filter((r) => !r.marquee && !r.chantier && !r.coupee && r.reg
      && roomDef(r).sig * EXPO(r.lvl) > 2);
    candidates.sort((a, b) => roomDef(b).sig * EXPO(b.lvl) - roomDef(a).sig * EXPO(a.lvl));
    if (candidates[0]) {
      candidates[0].marquee = true;
      journal(roomDef(candidates[0]).nom + " a été repérée d'en haut.");
      toast("Il a passé au-dessus. " + roomDef(candidates[0]).nom + " est repérée.", "bad");
    } else {
      toast("Il est passé au-dessus, moteurs coupés. +" + Math.round(vu) + " soupçon", "bad");
    }
    journal("Survol : la colline était allumée.");
    sfx("bad");
  }
  dirty = true; majTout();
}

/* =====================================================================
   8. SON (WebAudio, aucune ressource externe)
   ===================================================================== */

let AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { muted = true; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function beep(f, dur, type = "sine", gain = .05, slide = 0) {
  if (muted) return;
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, c.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), c.currentTime + dur);
  g.gain.setValueAtTime(gain, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur);
}
function noise(dur, gain = .05) {
  if (muted) return;
  const c = ac(); if (!c) return;
  const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(), g = c.createGain();
  s.buffer = b; g.gain.value = gain; s.connect(g); g.connect(c.destination); s.start();
}
function sfx(k) {
  switch (k) {
    case "tap": beep(520, .05, "square", .03); break;
    case "dig": noise(.35, .07); break;
    case "done": beep(430, .09, "triangle", .05); setTimeout(() => beep(640, .12, "triangle", .05), 90); break;
    case "good": beep(600, .08, "sine", .05); setTimeout(() => beep(880, .12, "sine", .045), 80); break;
    case "bad": beep(200, .28, "sawtooth", .05, -80); break;
    case "alarm": beep(880, .14, "square", .05); setTimeout(() => beep(660, .2, "square", .05), 160); break;
    case "off": beep(300, .4, "sine", .05, -240); break;
    case "win": [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .18, "triangle", .05), i * 130)); break;
  }
}

const scene = document.getElementById("scene");
const stage = document.getElementById("stage");
let dirty = true;
let menMap = new Map();

function sceneHeight() {
  return Math.max(levelTop(Math.min(MAX_LVL, S.depth)) + 30, 760);
}

function drawSky(g) {
  const sun = el("g", {}, g);
  penCircle(sun, 50, 52, 24, { seed: 3, amp: 1.2, w: 1.7 });
  const r = R(5);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + .25, r0 = 30 + r() * 3, r1 = r0 + 9 + r() * 7;
    penLine(sun, 50 + Math.cos(a) * r0, 52 + Math.sin(a) * r0,
      50 + Math.cos(a) * r1, 52 + Math.sin(a) * r1, { seed: 20 + i, w: 1.5, amp: .5, double: false });
  }
}

function hillPoints(off = 0) {
  const r = R(41), pts = [];
  for (let i = 0; i < HILL.length - 1; i++) {
    const [x1, y1] = HILL[i], [x2, y2] = HILL[i + 1];
    const seg = wobble(x1, y1 + off, x2, y2 + off, r, 1.5, 26);
    pts.push(...(i ? seg.slice(1) : seg));
  }
  return pts;
}

function drawTree(g, x, y, s, seed) {
  penLine(g, x, y, x, y - 34 * s, { seed, w: 1.8, amp: .7 });
  const r = R(seed + 1), pts = [], n = 22, rad = 17 * s;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, lob = 1 + .22 * Math.sin(a * 5 + seed) + r() * .12;
    pts.push([x + Math.cos(a) * rad * lob, y - 42 * s + Math.sin(a) * rad * lob * .95]);
  }
  pts.push(pts[1]);
  el("path", { d: toPath(pts), fill: "rgba(51,64,154,.05)", stroke: "#33409a", "stroke-width": 1.6, opacity: .9 }, g);
}

function drawBush(g, x, y, seed) {
  const r = R(seed), pts = [], n = 26;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, lob = 1 + .18 * Math.sin(a * 7) + r() * .1;
    pts.push([x + Math.cos(a) * 28 * lob, y + Math.sin(a) * 16 * lob]);
  }
  pts.push(pts[1]);
  el("path", { d: toPath(pts), fill: "rgba(51,64,154,.05)", stroke: "#33409a", "stroke-width": 1.5, opacity: .9 }, g);
  for (let i = 0; i < 8; i++) {
    const a = r() * Math.PI * 2, rr = r() * .7;
    const px = x + Math.cos(a) * 24 * rr, py = y + Math.sin(a) * 12 * rr;
    penLine(g, px, py, px + 3, py - 3, { seed: seed + i * 3, w: 1, amp: .3, double: false, step: 30 });
  }
}

function drawGrass(g, x, y, seed) {
  const r = R(seed);
  for (let i = 0; i < 2; i++) {
    const bx = x + i * 12, h = 50 + r() * 14;
    penLine(g, bx, y + 44, bx + (r() * 6 - 3), y + 44 - h, { seed: seed + i, w: 1.5, amp: 1.6, step: 12 });
    for (let k = 0; k < 8; k++) {
      const ty = y + 44 - h * (.28 + k * .085);
      penLine(g, bx - 5, ty + 3, bx + 5, ty - 1, { seed: seed + i * 20 + k, w: 1, amp: .5, double: false, step: 30 });
    }
  }
}

function drawHill(g, H) {
  const d = toPath(hillPoints());
  const underD = d + `L${W + 8} ${H + 10}L-8 ${H + 10}Z`;
  const defs = el("defs", {}, g);
  el("path", { d: underD }, el("clipPath", { id: "clip-terre" }, defs));
  el("path", { d: underD, fill: "rgba(51,64,154,.05)", stroke: "none" }, g);

  const terre = el("g", { "clip-path": "url(#clip-terre)" }, g);
  penHatch(terre, -10, SURF - 60, W + 20, 108, { seed: 501, gap: 12, op: .28 });
  const r = R(77);
  for (let i = 0; i < 30; i++) {
    penCircle(terre, r() * W, SURF + 20 + r() * (H - SURF - 10), 1.2 + r() * 2.2,
      { seed: 800 + i, w: .9, amp: .35, op: .28 });
  }
  el("path", { d, fill: "none", stroke: "#33409a", "stroke-width": 2.1, "stroke-linecap": "round", opacity: .95 }, g);
  el("path", { d: toPath(hillPoints(1.6)), fill: "none", stroke: "#33409a", "stroke-width": 1.1,
    "stroke-linecap": "round", opacity: .35 }, g);

  const veg = el("g", {}, g);
  drawTree(veg, 68, hillY(68), 1, 61);
  drawBush(veg, 122, hillY(122) - 14, 71);
  drawGrass(veg, 238, hillY(238) - 44, 81);
  drawGrass(veg, 266, hillY(266) - 42, 91);
  drawTree(veg, 338, hillY(338), .84, 101);

  // la façade de surface : un petit bâtiment posé sur la pente droite
  if (S.facade !== "aucune") drawFacade(g);
}

function drawFacade(g) {
  const x = 296, y = hillY(x) - 2;
  const f = S.facade;
  const gg = el("g", {}, g);

  } else if (f === "scierie") {
    penRect(gg, x - 26, y - 30, 52, 30, { seed: 920, w: 1.6, amp: .6 });
    penLine(gg, x - 30, y - 30, x, y - 44, { seed: 924, w: 1.6, amp: .6 });
    penLine(gg, x + 30, y - 30, x, y - 44, { seed: 926, w: 1.6, amp: .6 });
    for (let i = 0; i < 3; i++) penLine(gg, x + 30, y - 6 - i * 5, x + 46, y - 6 - i * 5, { seed: 930 + i, w: 1.2, amp: .4, double: false });
  } else {
    penRect(gg, x - 24, y - 22, 48, 22, { seed: 940, w: 1.5, amp: .6 });

}

function drawShaft(g) {
  const cx = SHAFT_X + SHAFT_W / 2, ySol = hillY(cx), yTour = ySol - 74;
  const bas = S.rooms.reduce((a, r) => Math.max(a, r.lvl), 0);
  const yBot = levelTop(bas) + LVL_H;

  // sous le dernier niveau creusé : le puits n'existe pas encore (trait fantôme)
  const suite = Math.min(MAX_LVL - 1, S.depth);
  if (suite > bas) {
    const yFin = levelTop(suite) + LVL_H;
    for (const px of [SHAFT_X, SHAFT_X + SHAFT_W]) {
      for (let y = yBot; y < yFin; y += 16) {
        penLine(g, px, y, px, Math.min(yFin, y + 9),
          { seed: 240 + y + px, w: 1.4, amp: .5, op: .28, double: false, step: 30 });
      }
    }
  }
  el("rect", { x: SHAFT_X, y: yTour, width: SHAFT_W, height: yBot - yTour, fill: "rgba(255,255,255,.55)" }, g);
  penLine(g, SHAFT_X, yTour, SHAFT_X, yBot, { seed: 201, w: 2, amp: .9, step: 34 });
  penLine(g, SHAFT_X + SHAFT_W, yTour, SHAFT_X + SHAFT_W, yBot, { seed: 205, w: 2, amp: .9, step: 34 });
  penLine(g, SHAFT_X, yTour, SHAFT_X + SHAFT_W, yTour, { seed: 209, w: 2, amp: .7 });
  penLine(g, SHAFT_X, yBot, SHAFT_X + SHAFT_W, yBot, { seed: 210, w: 2, amp: .7 });
  penLine(g, SHAFT_X + 3, yTour, SHAFT_X + SHAFT_W - 8, yTour - 11, { seed: 213, w: 1.6, amp: .5 });
  penLine(g, SHAFT_X - 2, ySol, SHAFT_X + SHAFT_W + 2, ySol, { seed: 217, w: 1.2, amp: .4, op: .5, double: false });
  for (let y = ySol + 14; y < yBot - 6; y += 18) {
    penLine(g, SHAFT_X + 6, y, SHAFT_X + SHAFT_W - 6, y + 1.5,
      { seed: 300 + y, w: 1.1, amp: .5, op: .45, double: false, step: 28 });
  }
}

function jauge(g, x, y, w, v, col) {
  penLine(g, x, y, x + w, y, { seed: 970, w: 1.2, amp: .3, op: .35, double: false, step: 40 });
  el("rect", { x, y: y - 2.5, width: Math.max(0, w * clamp(v, 0, 1)), height: 5,
    fill: col || "rgba(51,64,154,.5)", rx: 2 }, g);
}

function drawRoom(g, room) {
  const d = roomDef(room), x = slotX(room.side), y = levelTop(room.lvl);
  const gg = el("g", { class: "room", "data-id": room.id }, g);
  el("rect", { x, y, width: SLOT_W, height: LVL_H, fill: "rgba(255,255,255,.5)" }, gg);

  if (room.chantier > 0) {
    penHatch(gg, x, y, SLOT_W, LVL_H, { seed: 600 + room.id, gap: 13, op: .35 });
    penRect(gg, x, y, SLOT_W, LVL_H, { seed: 400 + room.id * 17, w: 1.6, amp: 1.4 });
    const t = el("text", { x: x + 9, y: y + 18, class: "rlbl" }, gg);
    t.textContent = d.nom;
    const t2 = el("text", { x: x + 9, y: y + 32, class: "rsub" }, gg);
    t2.textContent = "chantier — " + Math.ceil(room.chantier) + " s";
    jauge(gg, x + 9, y + LVL_H - 12, SLOT_W - 18,
      1 - room.chantier / BAL.chantierSec(room.lvl), "rgba(51,64,154,.4)");
    return gg;
  }

  penRect(gg, x, y, SLOT_W, LVL_H, { seed: 400 + room.id * 17, w: 1.9, amp: .8 });
  // couloir vers le puits
  const cy = y + LVL_H - 24;
  const cx1 = room.side === 0 ? x + SLOT_W : SHAFT_X + SHAFT_W;
  const cx2 = room.side === 0 ? SHAFT_X : x;
  penLine(gg, cx1, cy, cx2, cy, { seed: 420 + room.id, w: 1.3, amp: .4, op: .5, double: false });
  penLine(gg, cx1, y + LVL_H - 3, cx2, y + LVL_H - 3, { seed: 430 + room.id, w: 1.3, amp: .4, op: .5, double: false });

  const t = el("text", { x: x + 9, y: y + 18, class: "rlbl" }, gg);
  t.textContent = d.nom;

  const eteinte = !room.reg || S.silence > 0 || room.coupee;
  const rend = rendement(room);
  const sub = el("text", { x: x + 9, y: y + 31, class: "rsub" }, gg);
  if (eteinte) sub.textContent = S.silence > 0 ? "éteinte (silence)"
    : room.coupee ? "coupée — plus de courant" : "éteinte";
  else if (d.postes) sub.textContent = occupants(room.id).length + "/" + d.postes + " poste" + (d.postes > 1 ? "s" : "") +
    (rend > 0 ? " · " + Math.round(rend * 100) + " %" : " · à l'arrêt") +
    (room.reg !== 2 ? " · " + REGIMES[room.reg].court : "") + (room.panne ? " · en panne" : "");
  else sub.textContent = d.effet + (room.reg !== 2 ? " · " + REGIMES[room.reg].court : "") +
    (room.panne ? " · en panne" : "");

  if (!eteinte && d.postes && rend > 0) jauge(gg, x + 9, y + 38, SLOT_W - 18, rend);
  if (eteinte) el("rect", { x, y, width: SLOT_W, height: LVL_H, fill: "rgba(51,64,154,.14)" }, gg);

  // repérée par un survol : on l'a entourée au stylo rouge sur la feuille
  if (room.marquee) {
    penCircle(gg, x + SLOT_W / 2, y + LVL_H / 2, SLOT_W * .52,
      { seed: 1500 + room.id, w: 2, amp: 2.6, col: "#b4453c", op: .75, rot: .3 });
    const m = el("text", { x: x + SLOT_W - 8, y: y + LVL_H - 8, class: "rsub", "text-anchor": "end" }, gg);
    m.setAttribute("fill", "#b4453c");
    m.textContent = "repérée";
  }

  // la signature de la salle : de petites ondes qui montent
  const sg = d.sig * EXPO(room.lvl) * (eteinte ? 0 : (0.35 + 0.65 * rend)) * (room.marquee ? 1.6 : 1);
  if (sg > 2.2) {
    const ox = room.side === 0 ? x + SLOT_W - 20 : x + 14;
    for (let i = 0; i < 3; i++) {
      penLine(gg, ox - 6 - i * 2, y - 3 - i * 5, ox + 6 + i * 2, y - 5 - i * 5,
        { seed: 700 + room.id * 9 + i, w: 1.1, amp: 1.3, op: .3 + i * .06, double: false, step: 6, col: "#b4453c" });
    }
  }
  return gg;
}

function drawSlot(g, lvl, side) {
  const x = slotX(side), y = levelTop(lvl);
  const gg = el("g", { class: "slot", "data-lvl": lvl, "data-side": side }, g);
  el("rect", { x, y, width: SLOT_W, height: LVL_H, fill: "rgba(255,255,255,.12)" }, gg);
  const r = R(1000 + lvl * 7 + side);
  for (const [x1, y1, x2, y2] of [[x, y, x + SLOT_W, y], [x + SLOT_W, y, x + SLOT_W, y + LVL_H],
    [x + SLOT_W, y + LVL_H, x, y + LVL_H], [x, y + LVL_H, x, y]]) {
    const n = 7;
    for (let i = 0; i < n; i++) {
      if (i % 2) continue;
      const t1 = i / n, t2 = (i + 1) / n;
      penLine(gg, x1 + (x2 - x1) * t1, y1 + (y2 - y1) * t1, x1 + (x2 - x1) * t2, y1 + (y2 - y1) * t2,
        { seed: 1100 + lvl * 31 + side * 7 + i, w: 1.3, amp: .6, op: .34, double: false, step: 30 });
    }
  }
  const cx = x + SLOT_W / 2, cy = y + LVL_H / 2;
  penLine(gg, cx - 9, cy - 4, cx + 9, cy - 4, { seed: 1200 + lvl + side, w: 1.7, amp: .5, op: .45 });
  penLine(gg, cx, cy - 13, cx, cy + 5, { seed: 1210 + lvl + side, w: 1.7, amp: .5, op: .45 });
  const t = el("text", { x: cx, y: cy + 20, class: "rsub", "text-anchor": "middle" }, gg);
  t.textContent = "creuser · " + BAL.coutNiveau(lvl) + " matos + salle";
  return gg;
}

function renderScene() {
  const H = sceneHeight();
  scene.setAttribute("viewBox", `0 0 ${W} ${H}`);
  scene.setAttribute("width", W); scene.setAttribute("height", H);
  scene.setAttribute("preserveAspectRatio", "xMidYMin meet");
  scene.textContent = "";
  menMap = new Map();

  const bg = el("g", {}, scene);
  drawSky(bg); drawHill(bg, H);

  const gr = el("g", {}, scene);
  drawShaft(gr);
  const occupes = new Set(S.rooms.map((r) => r.lvl + ":" + r.side));
  for (let l = 0; l < Math.min(MAX_LVL, S.depth + 1); l++) {
    for (const side of [0, 1]) {
      if (!occupes.has(l + ":" + side)) drawSlot(gr, l, side);
    }
  }
  for (const r of S.rooms) drawRoom(gr, r);

  const gm = el("g", { id: "men" }, scene);
  for (const c of S.colons) menMap.set(c.id, stickman(gm, { s: .8, seed: 600 + c.id * 13 }));
  dirty = false;
}

// Les bonshommes bougent à chaque frame (sans redessiner la coupe).
let animT = 0;
function animerColons(dt) {
  animT += dt;
  for (const c of S.colons) {
    const g = menMap.get(c.id);
    if (!g) continue;
    let x, y, marche = true, cad = 3.4;
    if (c.dehors) {
      const op = S.ops.find((o) => o.equipe.includes(c.id));
      const prog = op ? 1 - op.reste / OPS[op.key].sec : .5;
      const px = 214 + Math.sin(prog * Math.PI) * 150;
      x = px; y = hillY(px) - 1; cad = 4.5;
    } else if (c.room) {
      const r = roomById(c.room);
      if (!r) { g.setAttribute("opacity", 0); continue; }
      const w = SLOT_W - 44;
      c.x += c.dir * dt * 0.055 * (0.6 + c.moral / 200);
      if (c.x > 1) { c.x = 1; c.dir = -1; } else if (c.x < 0) { c.x = 0; c.dir = 1; }
      x = slotX(r.side) + 22 + c.x * w;
      y = levelTop(r.lvl) + LVL_H - 7;
      marche = rendement(r) > 0 || !roomDef(r).postes;
    } else {
      // sans affectation : ils traînent au pied de l'échelle
      const idx = S.colons.filter((z) => !z.room && !z.dehors).indexOf(c);
      x = SHAFT_X + 14 + (idx % 3) * 13;
      y = levelTop(0) + LVL_H - 7;
      marche = false;
    }
    g.setAttribute("opacity", 1);
    g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${c.dir < 0 ? -1 : 1} 1)`);
    if (g._poses) {
      const pas = marche ? (Math.floor(animT * cad + c.id) % 2) : 2;
      for (let i = 0; i < 3; i++) g._poses[i].style.display = (i === pas ? "" : "none");
    }
  }
}

const gaugesEl = document.getElementById("gauges");
let gaugeNodes = {};
const GAUGES = [
  { k: "energie", nom: "énergie", flux: true },
  { k: "air", nom: "air", flux: true },
  { k: "eau", nom: "eau" },
  { k: "vivres", nom: "vivres" },
  { k: "matos", nom: "matos" },
];

function construireHud() {
  gaugesEl.textContent = "";
  gaugeNodes = {};
  for (const g of GAUGES) {
    const d = document.createElement("div");
    d.className = "g";
    d.appendChild(icon(g.k === "energie" ? "energie" : g.k === "air" ? "air" : g.k === "eau" ? "eau" :
      g.k === "vivres" ? "vivres" : "matos", 20));
    const v = document.createElement("div"); v.className = "gv";
    const s = document.createElement("div"); s.className = "gd";
    d.appendChild(v); d.appendChild(s);
    gaugesEl.appendChild(d);
    gaugeNodes[g.k] = { box: d, v, s };
  }
}

let lastVals = {};
function majHud() {
  document.getElementById("daylbl").textContent = "jour " + S.jour;
  document.getElementById("cashlbl").textContent = S.facade !== "aucune" ? Math.floor(S.res.cash) + " €" : "";

  const be = bilanEnergie(), ba = bilanAir(), cap = capacites();
  for (const g of GAUGES) {
    const n = gaugeNodes[g.k];
    let val, sub, warn = false;
    if (g.k === "energie") {
      val = Math.round(be.prod) + "/" + Math.round(be.dem);
      sub = be.coupees ? be.coupees + " salle" + (be.coupees > 1 ? "s" : "") + " coupée" + (be.coupees > 1 ? "s" : "")
        : "énergie";
      warn = be.coupees > 0;
    } else if (g.k === "air") {
      val = Math.round(ba.prod) + "/" + Math.round(ba.dem);
      sub = ba.taux >= 1 ? "air" : "ça manque";
      warn = ba.taux < .95;
      n.box.classList.toggle("hide", !S.vus.air && S.depth < 3);
    } else {
      const p = prodNette(g.k);
      val = Math.floor(S.res[g.k]);
      sub = g.k === "matos" ? "matos" : sign(p) + "/min";
      warn = S.res[g.k] < 8 && p < 0;
      if (g.k === "matos") { sub = "matos"; warn = false; }
    }
    if (n.v.textContent !== val) {
      n.v.textContent = val;
      if (lastVals[g.k] !== undefined && lastVals[g.k] !== val) {
        n.box.classList.remove("pop"); void n.box.offsetWidth; n.box.classList.add("pop");
      }
      lastVals[g.k] = val;
    }
    n.s.textContent = sub;
    n.box.classList.toggle("warn", warn);
  }

  const p = paliers();
  const fill = document.getElementById("heatfill");
  fill.style.width = S.soupcon + "%";
  fill.classList.toggle("hot", p.n >= 2);
  document.getElementById("heatlbl").textContent = p.lbl;
  const sig = signature(), tol = tolerance();
  document.getElementById("heatarrow").textContent = sig > tol ? "▲ " + fmt(sig) : "▼ " + fmt(sig);
  document.getElementById("heatarrow").style.color = sig > tol ? "var(--red)" : "var(--green)";

  // alerte
  const a = document.getElementById("alert");
  if (S.alerte) {
    a.classList.add("show");
    a.querySelector(".at").textContent = S.silence > 0 || S.alerte.coupe
      ? "Tout est éteint. Attendez qu'il passe."
      : "Un appareil approche. COUPEZ TOUT.";
    a.querySelector(".ac").textContent = Math.ceil(S.alerte.reste);
    a.querySelector("#alertin").classList.toggle("urgent", S.alerte.reste < 6 && !(S.silence > 0 || S.alerte.coupe));
  } else a.classList.remove("show");

  const db = document.querySelector('#dock button[data-tab="silence"]');
  if (db) {
    db.classList.toggle("on", S.silence > 0);

}

function ligne(parent, { nom, desc, tags, btn, onBtn, dis, off, ico }) {
  const r = document.createElement("div");
  r.className = "row" + (off ? " off" : "");
  if (ico) { const i = document.createElement("div"); i.className = "ricon"; i.appendChild(icon(ico, 22)); r.appendChild(i); }
  const t = document.createElement("div"); t.className = "rtxt";
  const n = document.createElement("div"); n.className = "rn"; n.textContent = nom;
  if (tags) for (const tg of tags) {
    const s = document.createElement("span");
    s.className = "tag " + (tg.k || ""); s.textContent = tg.t;
    s.style.marginLeft = "6px"; n.appendChild(s);
  }
  t.appendChild(n);
  if (desc) { const d = document.createElement("div"); d.className = "rd"; d.innerHTML = desc; t.appendChild(d); }
  r.appendChild(t);
  if (btn) {
    const b = document.createElement("button");
    b.className = "btn sm" + (dis ? "" : " pri"); b.textContent = btn; b.disabled = !!dis;
    b.onclick = onBtn; r.appendChild(b);
  }
  parent.appendChild(r);
  return r;
}

// --- creuser : choix de la salle pour un emplacement
function panneauCreuser(lvl, side) {
  tabOuvert = "creuser";
  ouvrirSheet("Creuser", "niveau " + (lvl + 1) + " · " + (side === 0 ? "côté gauche" : "côté droit"));
  sheetBody.textContent = "";
  const h = document.createElement("div");
  h.className = "hint";
  h.innerHTML = "Le chantier fait du bruit pendant <b>" + BAL.chantierSec(lvl) + " s</b>. " +
    "À cette profondeur, tout ce qu'on installe s'entend <b>×" + EXPO(lvl) + "</b> " +
    (EXPO(lvl) > 1 ? "— c'est juste sous la pelouse." : "— la roche étouffe.");
  sheetBody.appendChild(h);

  for (const key of Object.keys(ROOMS)) {
    const d = ROOMS[key];
    if (key === "sas") continue;
    if (d.unique && S.rooms.some((r) => r.key === key)) continue;
    const total = d.cout + BAL.coutNiveau(lvl);
    const manqueNiv = d.minLvl && lvl < d.minLvl;
    const manqueNeed = d.need && !S.rooms.some((r) => r.key === d.need && !r.chantier);
    const cher = S.res.matos < total;
    const tags = [{ t: d.sig >= 4 ? "bruyante" : d.sig >= 1.5 ? "discrète" : "muette", k: d.sig >= 4 ? "sig" : "good" }];
    if (d.postes) tags.push({ t: d.postes + " poste" + (d.postes > 1 ? "s" : "") });
    let desc = d.desc + "<br><b>" + d.effet + "</b>";
    if (manqueNiv) desc += "<br><span class='no'>Niveau " + (d.minLvl + 1) + " minimum.</span>";
    if (manqueNeed) desc += "<br><span class='no'>Il faut d'abord : " + ROOMS[d.need].nom + ".</span>";
    ligne(sheetBody, {
      nom: d.nom, desc, tags, ico: d.ico,
      btn: total + " matos", dis: cher || manqueNiv || manqueNeed,
      off: cher || manqueNiv || manqueNeed,
      onBtn: () => creuser(lvl, side, key),
    });
  }
}

// --- une salle existante
function panneauSalle(room) {
  const d = roomDef(room);
  tabOuvert = "salle";
  ouvrirSheet(d.nom, "niveau " + (room.lvl + 1));
  sheetBody.textContent = "";

  const h = document.createElement("div"); h.className = "hint";
  const sg = d.sig * EXPO(room.lvl);
  h.innerHTML = d.desc + "<br><b>" + d.effet + "</b> · signature à ce niveau : <b>" + fmt(sg) + "</b>";
  sheetBody.appendChild(h);

  if (room.chantier > 0) {
    const p = document.createElement("div"); p.className = "hint";
    p.textContent = "Chantier en cours — encore " + Math.ceil(room.chantier) + " s.";
    sheetBody.appendChild(p);
    return;
  }

  if (d.postes) {
    const occ = occupants(room.id);
    const t = document.createElement("div"); t.className = "hint";
    t.innerHTML = "<b>Postes " + occ.length + "/" + d.postes + "</b> — un colon dont c'est le métier produit à 100 %, un autre à 65 %.";
    sheetBody.appendChild(t);
    for (const c of S.colons) {
      if (c.dehors) continue;
      const ici = c.room === room.id;
      const bon = TALENTS[c.talent].salles.includes(room.key);
      ligne(sheetBody, {
        nom: c.nom, ico: "colon",
        tags: [{ t: TALENTS[c.talent].nom, k: bon ? "good" : "" }],
        desc: "moral " + Math.round(c.moral) + " %" + (ici ? " · en poste ici" : c.room ? " · " + (roomDef(roomById(c.room))?.nom || "") : " · sans affectation"),
        btn: ici ? "retirer" : "affecter",
        dis: !ici && occ.length >= d.postes,
        onBtn: () => { affecter(c.id, ici ? null : room.id); panneauSalle(room); },
      });
    }
  }

  if (room.panne) {
    const b = document.createElement("button");
    b.className = "btn wide ok";
    b.textContent = "Réparer (14 matos)";
    b.disabled = S.res.matos < 14;
    b.onclick = () => {
      S.res.matos -= 14; room.panne = false;
      toast("Réparé. Elle ronronne à nouveau.", "good");
      sfx("done"); dirty = true; majTout(); panneauSalle(room);
    };
    sheetBody.appendChild(b);
  }

  if (d.prod || d.conso) {
    const t = document.createElement("div"); t.className = "rn"; t.style.marginTop = "8px";
    t.textContent = "Régime";
    sheetBody.appendChild(t);
    const seg = document.createElement("div"); seg.className = "seg";
    REGIMES.forEach((rg, i) => {
      const b = document.createElement("button");
      b.textContent = rg.nom;
      if (room.reg === i) b.classList.add("on");
      b.onclick = () => { room.reg = i; dirty = true; majTout(); panneauSalle(room); sfx("tap"); };
      seg.appendChild(b);
    });
    sheetBody.appendChild(seg);
    const hr = document.createElement("div"); hr.className = "hint";
    const rg = REGIMES[room.reg];
    hr.innerHTML = rg.d + "<br>signature à ce régime : <b>" +
      fmt(d.sig * EXPO(room.lvl) * rg.sig * (room.marquee ? 1.6 : 1) * (room.panne ? 1.7 : 1)) + "</b>";
    sheetBody.appendChild(hr);
  }

  if (room.key !== "sas") {
    const rendu = Math.round((d.cout + BAL.coutNiveau(room.lvl)) * 0.5);
    const b = document.createElement("button");
    b.className = "btn wide bad";
    b.textContent = "Reboucher (récupère " + rendu + " matos)";
    b.onclick = () => {
      for (const c of S.colons) if (c.room === room.id) c.room = null;
      S.rooms = S.rooms.filter((r) => r.id !== room.id);
      S.res.matos = Math.min(capacites().matos, S.res.matos + rendu);
      journal(d.nom + " a été rebouchée.");
      toast("On remblaie. Il n'y a plus rien à voir.", "");
      sfx("dig"); fermerSheet(); dirty = true; majTout();
    };
    sheetBody.appendChild(b);
    if (room.marquee) {
      const h2 = document.createElement("div"); h2.className = "hint";
      h2.innerHTML = "<b style='color:var(--red)'>Cette salle est repérée.</b> Ils savent où elle est : " +
        "elle se voit 60 % de plus, définitivement. La reboucher est le seul moyen de l'effacer.";
      sheetBody.appendChild(h2);
    }
  }
}

/* =====================================================================
   14. BOUCLE
   ===================================================================== */

let last = performance.now(), acc = 0, saveCd = 0, hudCd = 0;
function boucle(now) {
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!modalOuverte && S.speed > 0 && !S.gameover) {
    acc += real * S.speed;
    while (acc >= 0.1) { step(0.1); acc -= 0.1; }
    saveCd -= real;
    if (saveCd <= 0) { sauver(); saveCd = 5; }
  }
  animerColons(real);                 // les bonshommes, eux, bougent à chaque image
  hudCd -= real;
  if (dirty || hudCd <= 0) { majTout(); hudCd = 0.14; }
  requestAnimationFrame(boucle);
}
